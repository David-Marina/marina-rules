# marina-rules-data: the Marina dataset as its own distribution, released on its own date-numbered schedule.
# Its content is generated, never committed: `python scripts/vendor_data.py` (repository root) copies data/ into
# marina_rules_data/data/ (plus the precompiled loader output, compiled.json) and LICENSE-DATA into LICENSE.
# The version is the dataset's own data/VERSION. This package depends on nothing; the code that reads it is the
# marina-rules package, which checks data/SCHEMA (the data format) before reading.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marina-rules-data"
dynamic = ["version"]
description = "The Marina dataset: point-in-time trading rules for financial markets (price limits, fees, sessions, settlement), each record citing its source. Read it with the marina-rules package."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC0-1.0"}
authors = [{name = "David Li"}]
keywords = ["trading-rules", "exchange-rules", "point-in-time", "backtest", "dataset"]
classifiers = [
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/David-Marina/marina-rules"
Issues = "https://github.com/David-Marina/marina-rules/issues"

[tool.setuptools]
packages = ["marina_rules_data"]

[tool.setuptools.dynamic]
version = {file = ["marina_rules_data/data/VERSION"]}

[tool.setuptools.package-data]
marina_rules_data = ["data/VERSION", "data/SCHEMA", "data/**/*.yaml", "data/samples/**/*.csv", "data/compiled.json"]

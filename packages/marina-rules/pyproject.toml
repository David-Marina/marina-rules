# marina-rules: the package everyone installs. It holds the dataset (the rule files and their precompiled form) and the
# module `marina_rules`, which forwards to the code in marina-rules-core (a dependency). Date versions, one per data
# release (usually weekly), taken from data/VERSION.
# Everything here except this file is generated, never committed: `python scripts/vendor_data.py --data` (repository
# root) copies src/marina_rules/*.py into marina_rules/, data/ into marina_rules/data/ (plus the precompiled loader
# output, compiled.json), and README.md, LICENSE and LICENSE-DATA beside this file. data/ stays the only source.
# The directory marina_rules/ has belonged to this distribution since the first release (which carried the code too);
# keeping it here is what lets `pip install -U marina-rules` upgrade from those releases (see tests/test_packages.py).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marina-rules"
dynamic = ["version"]
description = "Auditable backtests: the exchange trading rules in force on each day, with sources — China A-share price limits (涨跌停), stamp duty, fees, ticks, sessions; futures, Hong Kong, US. Fill checks for backtests and AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND CC0-1.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{name = "David Li"}]
keywords = ["trading", "trading-rules", "backtest", "backtesting", "exchange-rules", "price-limit", "fees", "point-in-time",
            "a-share", "china", "stock", "futures", "hong-kong", "quant", "agent", "mcp", "mcp-server", "price-limits", "limit-up",
            "limit-down", "stamp-duty", "transaction-fees", "tick-size", "trading-hours", "trading-sessions",
            "backtest-validation", "dataset", "china-stock", "sse", "szse", "bse", "cffex", "shfe", "hkex", "us-equities",
            "涨跌停", "涨跌幅限制", "印花税", "交易规则", "交易制度", "回测", "A股"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# the code; the oldest marina-rules-core that reads this dataset (scripts/check_release_metadata.py checks it)
dependencies = ["marina-rules-core>=1.0.0,<2"]

[project.optional-dependencies]
# The MCP server (marina-rules-mcp) for AI assistants: the extra of the code package, which names the MCP Python SDK.
mcp = ["marina-rules-core[mcp]>=1.0.0,<2"]

[project.urls]
Homepage = "https://github.com/David-Marina/marina-rules"
Documentation = "https://github.com/David-Marina/marina-rules#readme"
"Chinese README" = "https://github.com/David-Marina/marina-rules/blob/main/README.zh-CN.md"
"For AI agents" = "https://github.com/David-Marina/marina-rules/blob/main/SKILL.md"
Schema = "https://github.com/David-Marina/marina-rules/blob/main/docs/SCHEMA.md"
"Rule pages" = "https://david-marina.github.io/marina-rules/"
Changelog = "https://github.com/David-Marina/marina-rules/blob/main/CHANGELOG.md"
Source = "https://github.com/David-Marina/marina-rules"
Issues = "https://github.com/David-Marina/marina-rules/issues"

[project.scripts]
marina-check = "marina_rules.check:main"
marina-rules = "marina_rules.cli:main"
marina-rules-mcp = "marina_rules.mcp_server:main"

[tool.setuptools]
packages = ["marina_rules"]

[tool.setuptools.dynamic]
version = {file = ["marina_rules/data/VERSION"]}

[tool.setuptools.package-data]
marina_rules = ["data/VERSION", "data/SCHEMA", "data/**/*.yaml", "data/samples/**/*.csv", "data/compiled.json"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marina-rules"
version = "1.0.0"
description = "Point-in-time trading rules for financial markets, as data. Price limits, fees, sessions, settlement — every record cites its source. The code; the dataset is the marina-rules-data package."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND CC0-1.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{name = "David Li"}]
keywords = ["trading", "trading-rules", "backtest", "backtesting", "exchange-rules", "price-limit", "fees", "point-in-time",
            "a-share", "china", "stock", "futures", "hong-kong", "quant", "agent", "price-limits", "limit-up",
            "limit-down", "stamp-duty", "transaction-fees", "tick-size", "trading-hours", "trading-sessions",
            "backtest-validation", "dataset", "china-stock", "sse", "szse", "bse", "cffex", "shfe", "hkex", "us-equities",
            "涨跌停", "涨跌幅限制", "印花税", "交易规则", "交易制度", "回测", "A股"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pyyaml>=6", "marina-rules-data>=2026.11.13"]   # the minimum is marina_rules.MIN_DATA_VERSION

[project.urls]
Homepage = "https://github.com/David-Marina/marina-rules"
Documentation = "https://github.com/David-Marina/marina-rules#readme"
"Chinese README" = "https://github.com/David-Marina/marina-rules/blob/main/README.zh-CN.md"
"For AI agents" = "https://github.com/David-Marina/marina-rules/blob/main/SKILL.md"
Schema = "https://github.com/David-Marina/marina-rules/blob/main/docs/SCHEMA.md"
Changelog = "https://github.com/David-Marina/marina-rules/blob/main/CHANGELOG.md"
Source = "https://github.com/David-Marina/marina-rules"
Issues = "https://github.com/David-Marina/marina-rules/issues"

[project.scripts]
marina-check = "marina_rules.check:main"
marina-rules = "marina_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# This wheel is the code only. The dataset is the separate distribution marina-rules-data (packages/marina-rules-data/,
# generated from data/ by scripts/vendor_data.py), released on its own date-numbered schedule; the dependency above
# makes `pip install marina-rules` install it. A source checkout reads data/ directly.
# SKILL.md (the usage notes) is copied into the package by `scripts/vendor_data.py --code` and is read by
# `marina_rules.skill_text()`; the copy is git-ignored.
[tool.setuptools.package-data]
marina_rules = ["SKILL.md"]

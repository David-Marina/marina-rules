# marina-rules-core: the code (lookups, fill checker, adapters, command line, decision contract) as the module
# `marina_rules_core`. Semantic versions, released when the code changes. Users install marina-rules (the dataset,
# packages/marina-rules/), which depends on this and provides the import name `marina_rules` and the commands.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marina-rules-core"
version = "1.0.0"
description = "The code of marina-rules (point-in-time exchange trading rules as data): lookups, fill checker, engine adapters, command line. Install marina-rules, which holds the rules and depends on this."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "David Li"}]
keywords = ["trading", "trading-rules", "backtest", "backtesting", "exchange-rules", "price-limit", "fees", "point-in-time",
            "a-share", "china", "stock", "futures", "hong-kong", "quant", "agent", "mcp", "mcp-server", "price-limits", "limit-up",
            "limit-down", "stamp-duty", "transaction-fees", "tick-size", "trading-hours", "trading-sessions",
            "backtest-validation", "dataset", "china-stock", "sse", "szse", "bse", "cffex", "shfe", "hkex", "us-equities",
            "涨跌停", "涨跌幅限制", "印花税", "交易规则", "交易制度", "回测", "A股"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# The MCP server (marina_rules_core.mcp_server; the command marina-rules-mcp belongs to marina-rules) for AI assistants.
# The MCP Python SDK needs Python 3.10+; on 3.9 the extra installs nothing and the entry point says so. Nothing else in
# the package imports it. Users ask for it as marina-rules[mcp], which asks for this.
mcp = ['mcp>=2.3,<3; python_version >= "3.10"']

[project.urls]
Homepage = "https://github.com/David-Marina/marina-rules"
Documentation = "https://github.com/David-Marina/marina-rules#readme"
"Chinese README" = "https://github.com/David-Marina/marina-rules/blob/main/README.zh-CN.md"
"For AI agents" = "https://github.com/David-Marina/marina-rules/blob/main/SKILL.md"
Schema = "https://github.com/David-Marina/marina-rules/blob/main/docs/SCHEMA.md"
"Rule pages" = "https://david-marina.github.io/marina-rules/"
Changelog = "https://github.com/David-Marina/marina-rules/blob/main/CHANGELOG.md"
Source = "https://github.com/David-Marina/marina-rules"
Issues = "https://github.com/David-Marina/marina-rules/issues"

[tool.setuptools]
packages = ["marina_rules_core"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# This wheel is the code only, with no data and no commands; the dataset package marina-rules (generated from data/ by
# scripts/vendor_data.py into packages/marina-rules/) depends on it. A source checkout reads data/ directly.
# SKILL.md (the usage notes) is copied into the package by `scripts/vendor_data.py --code` and is read by
# `marina_rules.skill_text()`; the copy is git-ignored.
[tool.setuptools.package-data]
marina_rules_core = ["SKILL.md"]

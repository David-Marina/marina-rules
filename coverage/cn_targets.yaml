- target: BJSE:stock:commission_cap
  from: '2021-11-15'
  to: null
  reason: "No official text found that sets a statutory cap / minimum for brokerage commission on BSE stocks. 证监发〔2002〕21号 covers a股、b股、证券投资基金 on the exchanges of 2002; whether BSE stocks (former NEEQ select-tier shares, settled by CSDC Beijing) fall under it is not stated by any CSRC/BSE/CSDC text located. Broker fee schedules disagree (some state a 3‰ cap with ¥5 minimum, others 2‰ or no minimum) and are not official. bse.cn / bseinfo.net / neeq.com.cn searched for 佣金 rules; only exchange handling fees (北证公告〔2021〕49号) were found. The BSE trading rules (2021 trial 9.1, 2026 9.1) say only 投资者买卖证券成交的，应当按规定向会员交纳佣金 and 9.3 收费…按有关规定执行 — no level. Searched again 2026-10-29 (step 4): CSRC Order 204 证券经纪业务管理办法 (in force 2023-02-28) art. 28 requires brokers to publish and follow their own schedule and forbids commissions 明显低于服务成本 — no cap, and no statement that commission is uncapped; art. 51 extends it to 国务院批准的其他证券交易场所 by analogy only. NEEQ 股转系统公告〔2013〕7号 (fee schedule) attachments: neeq.com.cn returns 403 to non-browser clients and no archived copy exists; a 2015 broker document claims NEEQ applied the 2002 3‰ cap (not official, and NEEQ ≠ BSE). bse.cn search for 佣金 returns only company disclosures."

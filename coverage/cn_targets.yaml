  start: '2021-01-29'
  existence: reits_sse
  applies_to: [reits_day1]
  not_applicable:
    reason: 'Securities-transaction stamp duty is levied only on transfers of shares: the MOF notices 2005–2008 name A股、B股股权转让书据 as the taxable object; from 2022-07-01 the Stamp Duty Law art.3 limits 证券交易
      to 股票和以股票为基础的存托凭证. Public infrastructure reits (公开募集基础设施证券投资基金) are neither, on either side of the trade. REITs are 证券投资基金, not shares. The CSDC SSE/SZSE fee tables (2026-01-01) list stamp duty only
      for A/B shares, preferred shares, exchangeable-bond conversion and depositary receipts. Applies to stamp_duty_sell and stamp_duty_buy alike.'

      hash_kind: text
      quote: 继续对投资者(包括个人和机构)买卖封闭式证券投资基金免征印花税
- id: XSHG:etf:stamp_duty_buy
  market: XSHG
  scope: etf
  rule: stamp_duty_buy
  start: '2006-07-01'
  existence: a_share_floor
  applies_to: [etf_20pct, etf_bond, etf_money, etf_gold, etf_commodity, etf_crossborder]
  not_applicable:
    reason: 'Securities-transaction stamp duty is levied only on transfers of shares: the MOF notices 2005–2008 name A股、B股股权转让书据 as the taxable object; from 2022-07-01 the Stamp Duty Law art.3 limits 证券交易
      to 股票和以股票为基础的存托凭证. Listed funds (etf/lof, closed-end funds) are neither, on either side of the trade. Closed-end funds are explicitly exempt (财税〔2004〕173号). The CSDC SSE/SZSE fee tables (2026-01-01)
      list stamp duty only for A/B shares, preferred shares, exchangeable-bond conversion and depositary receipts. Applies to stamp_duty_sell and stamp_duty_buy alike.'
    sources:
    - url: https://www.mof.gov.cn/zhengwuxinxi/caizhengxinwen/200809/t20080919_76432.htm
      content_sha256: 531c64dde8a5d3f931159b4587eb3ab411b0e69ae9b35c94a4482e70388e2e87
      hash_kind: text
      quote: 调整为单边征税，即对买卖、继承、赠与所书立的Ａ股、Ｂ股股权转让书据的出让方按千分之一的税率征收证券（股票）交易印花税，对受让方不再征税。
    - url: https://fgk.chinatax.gov.cn/zcfgk/c100009/c5193058/content.html
      content_sha256: 66fe946219e679d25ecd14c5396ba0604bac4d51b30861f0231055a03a8140f1
      hash_kind: text
      quote: 本法所称证券交易，是指转让在依法设立的证券交易所、国务院批准的其他全国性证券交易场所交易的股票和以股票为基础的存托凭证。
    - url: http://www.chinaclear.cn/zdjs/fbzyls/202512/922adc26c2ff4865930c7fb77688bb8a/files/%E4%B8%8A%E6%B5%B7%E5%B8%82%E5%9C%BA%E8%AF%81%E5%88%B8%E7%99%BB%E8%AE%B0%E7%BB%93%E7%AE%97%E4%B8%9A%E5%8A%A1%E6%94%B6%E8%B4%B9%E5%8F%8A%E4%BB%A3%E6%94%B6%E7%A8%8E%E8%B4%B9%E4%B8%80%E8%A7%88%E8%A1%A8.pdf
      content_sha256: 84a99e563cb8e84e264c88e3bea2df5f4ac50b1e95330417ec30e2b2566d862f
      hash_kind: bytes
      quote: 证券交易印花税 A 股、B股、优先股、可 交换公司债换股、科创板 存托凭证 按成交金额的 1‰向出让方收取，减半征收。
    - url: http://www.chinaclear.cn/zdjs/fbzyls/202512/a59388fbfa714c5fa546784891a42e30/files/%E6%B7%B1%E5%9C%B3%E5%B8%82%E5%9C%BA%E8%AF%81%E5%88%B8%E7%99%BB%E8%AE%B0%E7%BB%93%E7%AE%97%E4%B8%9A%E5%8A%A1%E6%94%B6%E8%B4%B9%E5%8F%8A%E4%BB%A3%E6%94%B6%E7%A8%8E%E8%B4%B9%E4%B8%80%E8%A7%88%E8%A1%A8.pdf
      content_sha256: dff4a06ce20e180f4a85ddae138211dcf7dd3246fb84775453cfd21cbaec6573
      hash_kind: bytes
      quote: 证券交易印花税 A股、B 股、优先股、 存托凭证、可交换公司 债换股 按成交金额的 1‰向出让方收取，减半征收。
    - url: https://www.mof.gov.cn/zhengwuxinxi/zhengcefabu/2004zcfb/200805/t20080524_34539.htm
      content_sha256: 2523e7be83c6c834fc062fc4f9d7fe9b5fd233e99dd61be29691a0775310ea5f
      hash_kind: text
      quote: 继续对投资者(包括个人和机构)买卖封闭式证券投资基金免征印花税

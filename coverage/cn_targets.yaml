  reason: "上证财字〔2010〕6号 was repealed on 2021-12-31 by 上证发〔2021〕95号 (attachment 2, item 4). The replacing 收费管理规则适用指引第1号 (2021, and its 2023-08 revision) and the current SSE 收费项目、收费标准一览表 (2025-12-31) list exchange fees only — no commission cap or minimum for bonds/convertibles (checked again 2026-10-29: neither text contains 佣金). sse.com.cn search API (固定收益类产品收费标准, 交易佣金, 可转换公司债券 佣金) found no later SSE commission text. Broker schedules (0.2‰, 1元) are not official. Searched 2026-10-29 (step 4): szse.cn search API (titles/content: 佣金, 交易佣金, 收费标准, 可转换公司债券, 可转债, 收费一览表) — only exchange-fee notices (深证会〔2007〕108号 债券现货 0.2‰ without 可转债; 2012-04-30; 深证会〔2015〕233号 listing fees; 深证上〔2022〕720号 可转债 fee list = handling and listing fees only); current szse.cn payFees page and English Trading Fees page (exchange fees only, no 佣金 section); web.archive.org captures of szse.cn/main/aboutus/service/sjssf/ 2007–2017 and szse.cn/main/en/Products/Trading/TradingFees/ 2011–2019 (佣金 section present until the 2013-11-14 version, absent from the 2014-08-25 version on); CSRC Order 204 证券经纪业务管理办法 (2022-12, in force 2023-02-28) art. 28 — brokers must publish their schedule and not charge 明显低于服务成本; it sets no cap and does not say commissions are uncapped, and its 征求意见稿 was not used. No official text says convertible commissions are freely negotiated / 不设上限, so no 'unlimited' value is recorded."

# Coverage targets · China A-share (XSHG, XSHE, BJSE) — the denominator of scripts/coverage_report.py.
#
# Maintainer decision 2026-10-25: coverage of China A-shares must be 100% from 2006-07-01 onward;
# earlier dates are out of scope. CFFEX futures (CCFX), SHFE futures (XSGE), INE futures (XINE), CZCE futures (XZCE) and GFEX futures (GFEX) are not part of this target;
# nor are Hong Kong equities (XHKG, data/hk/) or US equities (XNYS, XNAS, data/us/).
#
# A target is (market, scope, rule, start[, end]). For every calendar day in [start, end or today] exactly one
# record must answer marina_rules.record_at(rule, day, scope, market). start = max(2006-07-01, the date
# the board / product / regime first existed), taken from `existence` (source URL next to each date;
# `existence_source: TODO` = best-known date, not yet sourced in the repo).
#
# `scope` is the scope the data records the rule under. Rules that do not distinguish boards are recorded
# under a family scope (fees and T+1 under `stock`, fund tick/session under `etf`, B-share tick under
# `b_share`); `applies_to` lists the registry scopes that family target answers for. Every A-share scope in
# scopes.yaml appears as a target scope or in some applies_to (tests/test_coverage_targets.py).
#
# A target may carry `not_applicable:` when the rule provably does not apply to the product; such a target counts as
# covered and the report lists it separately. Form: {reason: "...", sources: [{url, content_sha256 (64 hex, computed
# with scripts/hash_source.py), hash_kind, quote}]}.
#
# Transfer-fee mapping (step 2). For each market and day exactly one transfer-fee rule is expected:
#   XSHG  2006-07-01..2015-08-01  transfer_fee_par_value   (fraction of traded PAR VALUE, CSDC portion)
#   XSHG  2015-08-01..            transfer_fee_each_side   (fraction of turnover)
#   XSHE  2006-07-01..            transfer_fee_each_side   (0.0255‰ of turnover inside the SZSE handling fee until 2015-08-01)
#   BJSE  2021-11-15..2022-04-29  transfer_fee_each_side under scope bse_stock (BSE-only 0.025‰)
#   BJSE  2022-04-29..            transfer_fee_each_side under scope stock (national 0.01‰ record, XSHG+XSHE+BJSE)
# The basis change on 2015-08-01 is CSDC's notice of 2015-07-09 (existence key sse_transfer_fee_turnover).
# The BJSE scope change on 2022-04-29 is CSDC's notice of 2022-04-28 (existence key bse_transfer_fee_unified).
#
# `new_rules` lists rule names targeted before their first record exists (none now: stamp_duty_buy and
# transfer_fee_par_value landed in step 2 and are registered in docs/SCHEMA.md).
schema: 1.1
market: XSHG+XSHE+BJSE
new_rules: {}

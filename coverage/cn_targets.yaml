- id: XSHG:reits:transfer_fee_each_side
  market: XSHG
  scope: reits
  rule: transfer_fee_each_side
  start: '2021-01-29'
  existence: reits_sse
  applies_to: [reits_day1]
  not_applicable:
    reason: 'The trading transfer fee (交易过户费) is charged by CSDC on A shares (and exchangeable-bond conversion, depositary receipts), not on public infrastructure REITs (公开募集基础设施证券投资基金): the CSDC SSE/SZSE
      fee tables (2026-01-01) list 交易过户费 only for those items. Inference across dates: no official text found that ever introduced a trading transfer fee for this product; the snapshots cited are consistent
      with none.'
    sources:
    - url: http://www.chinaclear.cn/zdjs/fbzyls/202512/922adc26c2ff4865930c7fb77688bb8a/files/%E4%B8%8A%E6%B5%B7%E5%B8%82%E5%9C%BA%E8%AF%81%E5%88%B8%E7%99%BB%E8%AE%B0%E7%BB%93%E7%AE%97%E4%B8%9A%E5%8A%A1%E6%94%B6%E8%B4%B9%E5%8F%8A%E4%BB%A3%E6%94%B6%E7%A8%8E%E8%B4%B9%E4%B8%80%E8%A7%88%E8%A1%A8.pdf
      content_sha256: 84a99e563cb8e84e264c88e3bea2df5f4ac50b1e95330417ec30e2b2566d862f
      hash_kind: bytes
      quote: 交易过户费 A股 按照成交金额的 0.01‰向买卖双方收取。 投资者 可交换公司债换股 按照成交金额的 0.01‰向买卖双方收取。
    - url: http://www.chinaclear.cn/zdjs/fbzyls/202512/a59388fbfa714c5fa546784891a42e30/files/%E6%B7%B1%E5%9C%B3%E5%B8%82%E5%9C%BA%E8%AF%81%E5%88%B8%E7%99%BB%E8%AE%B0%E7%BB%93%E7%AE%97%E4%B8%9A%E5%8A%A1%E6%94%B6%E8%B4%B9%E5%8F%8A%E4%BB%A3%E6%94%B6%E7%A8%8E%E8%B4%B9%E4%B8%80%E8%A7%88%E8%A1%A8.pdf
      content_sha256: dff4a06ce20e180f4a85ddae138211dcf7dd3246fb84775453cfd21cbaec6573
      hash_kind: bytes
      quote: 交易过户费 A股 1、按照成交金额的 0.01‰向买卖双方收取。
    - url: https://www.chinaclear.cn/zdjs/gszb/201507/59ccd4176d2645f8b60b2d30fc3631bf.shtml
      content_sha256: 957ae21a54fa26cec0a7d0cd655baae43ae5318f9f6dd53c315e4fd9fb0f65ee
      hash_kind: text
      quote: A 股交易过户费由沪市按照成交面值 0.3 ‰、深市按照成交金额 0.0255 ‰向买卖双方投资者分别收取，统一调整为按照成交金额 0.02 ‰向买卖双方投资者分别收取。

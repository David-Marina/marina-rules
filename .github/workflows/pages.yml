# Publishes the rule fact pages (scripts/build_site.py) to GitHub Pages whenever main changes — that is, once per
# release — or on demand. The pages are generated from data/ at build time; nothing is committed.
# One-time setup in the repository settings: Pages → Build and deployment → Source: GitHub Actions.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: generate the pages
        run: python scripts/build_site.py --out _site --base-url https://david-marina.github.io/marina-rules/
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

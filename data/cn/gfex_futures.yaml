    publisher: 广州期货交易所（存档）
    title: 广州期货交易所结算管理办法
    date: null
    kind: official
    quote: 第四十六条 期货合约以当日结算价作为计算当日盈亏的依据。具体计算公式如下： 当日盈亏=平仓盈亏+持仓盈亏 平仓盈亏=平历史仓盈亏+平当日仓盈亏 平历史仓盈亏=｛Σ [（卖出平仓价－上一交易日结算价）×卖出平仓量]+
      Σ [（上一交易日结算价－买入平仓价）×买入平仓量]｝×交易单位（或合约乘数） 平当日仓盈亏=｛Σ [（当日卖出平仓价－当日买入开仓价）×卖出平仓量]+Σ[（当日卖出开仓价－当日买入平仓价）×买入平仓量]｝×交易单位（或合约乘数）
      持仓盈亏=历史持仓盈亏+当日开仓持仓盈亏 历史持仓盈亏=｛Σ [（上一日结算价－当日结算价）×卖出历史持仓量]+ Σ[（当日结算价－上一日结算价）×买入历史持仓量]｝×交易单位（或合约乘数） 当日开仓持仓盈亏 =｛Σ[（卖出开仓价－当日结算价）×卖出开仓量]+Σ
      [（当日结算价－买入开仓价）×买入开仓量] ｝×交易单位（或合约乘数） 期权合约不计算当日盈亏。
    content_sha256: 7e0bf97ea9c623c617db00afef14c459bb06251adfeeed17d5b941474d3e4774
    hash_kind: text
  notes: Same-day closing is inferred from the exchange settlement formula for closing a position opened on the
    same day. This does not imply actual trades, zero fees or unrestricted opening. Coverage begins at the research-window
    boundary for existing products and at the documented listing date for new products; the inception of the general
    settlement rule is not asserted.

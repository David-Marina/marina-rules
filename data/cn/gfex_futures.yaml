    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，交易所将在2025年劳动节假期休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2025年4月29日（星期二）结算时起，工业硅期货合约涨跌停板幅度调整为8%，投机交易保证金标准调整为10%，套期保值交易保证金标准调整为9%；多晶硅期货合约涨跌停板幅度调整为9%，投机交易保证金标准调整为11%，套期保值交易保证金标准调整为10%；碳酸锂期货合约涨跌停板幅度调整为10%，投机交易保证金标准调整为12%，套期保值交易保证金标准调整为11%。

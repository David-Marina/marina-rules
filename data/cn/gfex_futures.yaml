    date: '2024-06-04'
    kind: official
    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，交易所将在2024年端午节休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2024年6月6日（星期四）结算时起，工业硅期货合约涨跌停板幅度调整为7%，投机交易保证金标准调整为9%，套期保值交易保证金标准调整为8%；碳酸锂期货合约涨跌停板幅度和交易保证金标准维持不变。
      自2024年6月11日（星期二）恢复交易后，在工业硅期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，工业硅期货合约涨跌停板幅度维持7%，投机交易保证金标准维持9%，套期保值交易保证金标准维持8%；碳酸锂期货合约涨跌停板幅度和交易保证金标准维持不变。
      如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。 请各会员单位做好对客户的风险提示工作，加强市场风险防范，确保市场平稳运行。

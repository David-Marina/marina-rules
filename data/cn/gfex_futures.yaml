    title: 关于加强2025年清明节休市期间风险管理及节后调整相关期货合约涨跌停板幅度、交易保证金标准的通知
    date: '2025-03-31'
    kind: official
    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，2025年清明节休市期间，广州期货交易所各品种期货合约涨跌停板幅度和交易保证金标准保持不变。请各会员单位做好对客户的风险提示工作，加强市场风险防范，确保市场平稳运行。
      2025年4月7日（星期一）恢复交易后，在相关品种持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，工业硅期货合约涨跌停板幅度调整为6%，投机交易保证金标准调整为8%，套期保值交易保证金标准调整为7%；碳酸锂期货合约涨跌停板幅度调整为8%，投机交易保证金标准调整为10%，套期保值交易保证金标准调整为9%。
      表：我所清明节前后各品种期货合约风控参数对比 品种 现行标准 清明节后标准 涨跌停板 交易保证金 涨跌停板 交易保证金 投机 保值 投机 保值 工业硅 7% 9% 8% 6% 8% 7% 多晶硅 7% 9% 8%
      7% 9% 8% 碳酸锂 10% 12% 11% 8% 10% 9% 如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。

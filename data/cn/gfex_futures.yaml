    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，交易所将在2026年元旦节休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2025年12月30日（星期二）结算时起，工业硅期货合约涨跌停板幅度及交易保证金标准维持不变；多晶硅期货合约涨跌停板幅度维持不变，投机交易保证金标准、套期保值交易保证金标准调整为15%；碳酸锂期货合约涨跌停板幅度调整为10%，投机交易保证金标准调整为12%，套期保值交易保证金标准调整为11%；铂、钯期货合约涨跌停板幅度调整为13%，投机交易保证金标准、套期保值交易保证金标准调整为15%。
      2026年1月5日（星期一）恢复交易后，在各品种期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，工业硅期货合约涨跌停板幅度及交易保证金标准维持不变；多晶硅、铂及钯期货合约涨跌停板幅度、投机交易保证金标准及套期保值交易保证金标准维持假期期间标准不变；碳酸锂期货合约涨跌停板幅度、投机交易保证金标准及套期保值交易保证金标准恢复至调整前水平。

    quote: 第九条 某期货合约所处期间符合调整交易保证金要求的，自该期间首日的前一交易日结算时起，该期货合约的所有持仓按照新的交易保证金标准收取相应的交易保证金。 当日开仓交易保证金按照前一交易日结算价收取相应标准的交易保证金；结算时，按照当日结算价收取相应标准的交易保证金。新上市期货合约挂牌当日的挂牌基准价视为该合约前一交易日的结算价。
    content_sha256: 696fd2fccf67e9e0758e4fbca93958316dbb91a7eef058c52cfe915503993561
    hash_kind: text
  notes: 'Exchange speculative general-month margin as a fraction of contract value. Exclude delivery months and
    contracts entering the delivery ladder on the next trading day: trading day 15 of the preceding month for SI
    and LC contracts before LC2512; day 10 for LC2512 and later contracts, PS, PT and PD. Exclude a contract on
    its first observed listing day, except the product debut where the listing notice sets the same ordinary margin.
    Require every remaining observed contract to equal the cited ordinary standard. Independent one-sided flags
    are unavailable; nonuniform or above-standard days are explicit gaps rather than inferred exclusions. Daily
    values checked against the exchange settlement-parameter page. Coverage resumes when all eligible observations
    return to the cited standard; this boundary is not a new product-level increase. '

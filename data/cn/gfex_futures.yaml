    quote: 各会员单位： 根据《广州期货交易所交易管理办法》《广州期货交易所风险管理办法》，经研究决定，对铂、钯期货相关合约的交易指令每次最小开仓下单数量、涨跌停板幅度、交易保证金标准作如下调整： 自2026年3月24日交易时起，铂期货PT2606、PT2608、PT2610、PT2612、PT2702合约的交易指令每次最小下单数量中的每次最小开仓下单数量调整为1手、每次最小平仓下单数量维持1手，钯期货PD2606、PD2608、PD2610、PD2612、PD2702合约的交易指令每次最小下单数量中的每次最小开仓下单数量调整为1手、每次最小平仓下单数量维持1手。
      自2026年3月24日结算时起，铂、钯期货合约涨跌停板幅度调整为17%，交易保证金标准调整为19%。 如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。

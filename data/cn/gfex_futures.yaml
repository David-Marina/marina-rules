  sources:
  - url: https://web.archive.org/web/20260401224625id_/http://www.gfex.com.cn/gfex/tzts/202604/40edc0bae4404358a64a7fdb8fa80ae7.shtml
    publisher: 广州期货交易所（存档）
    title: 关于调整多晶硅期货相关合约交易指令每次最小开仓下单数量、交易手续费标准、交易限额及交易保证金标准的通知
    date: '2026-04-01'
    kind: official
    quote: 各会员单位： 经研究决定，对多晶硅期货相关合约的交易指令每次最小开仓下单数量、交易手续费标准、交易限额及交易保证金标准作如下调整： 自2026年4月3日交易时起，多晶硅期货PS2604、PS2605、PS2606、PS2607、PS2608、PS2609、PS2610、PS2611、PS2612、PS2701、PS2702、PS2703合约的交易指令每次最小下单数量中的每次最小开仓下单数量调整为5手、每次最小平仓下单数量维持1手，交易手续费标准调整为成交金额的万分之二点五、日内平今仓交易手续费标准调整为成交金额的万分之二点五。
      自2026年4月3日交易时起，非期货公司会员或者客户在多晶硅期货PS2606、PS2607、PS2608、PS2609、PS2610、PS2611、PS2612、PS2701、PS2702、PS2703合约上单日开仓量分别不得超过200手。该单日开仓量是指非期货公司会员或者客户当日在单个合约上的买开仓数量与卖开仓数量之和。套期保值交易、做市交易的单日开仓数量不受上述标准限制。具有实际控制关系的账户按照一个账户管理。
      自2026年4月3日结算时起，多晶硅期货合约交易保证金标准调整为13%，PS2604、PS2605合约交易保证金标准维持15%。如遇上述交易保证金标准与现行执行的交易保证金标准不同时，则按两者中标准高的执行。
    content_sha256: e05b91955773cb77072918db2a28526eba4c6064ada42ccdf70abe7576682674
    hash_kind: text

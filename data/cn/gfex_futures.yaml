    title: 关于2024年国庆节假期调整相关期货合约涨跌停板幅度和交易保证金标准的通知
    date: '2024-09-24'
    kind: official
    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，广州期货交易所将在2024年国庆节假期休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2024年9月27日（星期五）结算时起，工业硅期货合约涨跌停板幅度调整为9%，投机交易保证金标准调整为11%，套期保值交易保证金标准调整为10%；碳酸锂期货合约涨跌停板幅度调整为12%，投机交易保证金标准调整为14%，套期保值交易保证金标准调整为13%。
      2024年10月8日（星期二）恢复交易后，在各品种期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，上述品种期货合约涨跌停板幅度、投机交易保证金标准和套期保值交易保证金标准恢复至调整前水平。
      如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。

    publisher: 广州期货交易所（存档）
    title: 关于2026年元旦节假期调整相关期货合约涨跌停板幅度和交易保证金标准的通知
    date: '2025-12-26'
    kind: official
    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，交易所将在2026年元旦节休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2025年12月30日（星期二）结算时起，工业硅期货合约涨跌停板幅度及交易保证金标准维持不变；多晶硅期货合约涨跌停板幅度维持不变，投机交易保证金标准、套期保值交易保证金标准调整为15%；碳酸锂期货合约涨跌停板幅度调整为10%，投机交易保证金标准调整为12%，套期保值交易保证金标准调整为11%；铂、钯期货合约涨跌停板幅度调整为13%，投机交易保证金标准、套期保值交易保证金标准调整为15%。
      2026年1月5日（星期一）恢复交易后，在各品种期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，工业硅期货合约涨跌停板幅度及交易保证金标准维持不变；多晶硅、铂及钯期货合约涨跌停板幅度、投机交易保证金标准及套期保值交易保证金标准维持假期期间标准不变；碳酸锂期货合约涨跌停板幅度、投机交易保证金标准及套期保值交易保证金标准恢复至调整前水平。
      表：我所元旦节假期前后各品种期货合约风控参数对比 品种 现行标准 假期期间标准 假期后标准 涨跌停板 交易保证金 涨跌停板 交易保证金 涨跌停板 交易保证金 投机 保值 投机 保值 投机 保值 工业硅 8% 10%
      9% 8% 10% 9% 8% 10% 9% 多晶硅 9% 11% 10% 9% 15% 15% 9% 15% 15% 碳酸锂 9% 11% 10% 10% 12% 11% 9% 11% 10% 铂 10% 12%
      12% 13% 15% 15% 13% 15% 15% 钯 10% 12% 12% 13% 15% 15% 13% 15% 15% 如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。
    content_sha256: 2e304bba955c4aeb4b486049b7f5098a924d10c4c54ad2a3f22db23d4f9778c4
    hash_kind: text

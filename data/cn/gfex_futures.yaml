    title: 关于2026年国庆节假期调整相关期货合约涨跌停板幅度和交易保证金标准的通知
    date: '2026-09-21'
    kind: official
    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，交易所将在2026年国庆节假期休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2026年9月29日（星期二）结算时起，工业硅期货合约涨跌停板幅度调整为10%，投机交易保证金标准调整为12%，套期保值交易保证金标准调整为11%；多晶硅期货合约涨跌停板幅度调整为11%，投机交易保证金标准调整为15%，套期保值交易保证金标准调整为15%；碳酸锂期货合约涨跌停板幅度调整为15%，投机交易保证金标准调整为17%，套期保值交易保证金标准调整为16%；铂、钯期货合约涨跌停板幅度调整为16%，投机交易保证金标准、套期保值交易保证金标准调整为18%。
      2026年10月8日（星期四）恢复交易后，在各品种期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，工业硅、多晶硅、碳酸锂期货合约涨跌停板幅度、投机交易保证金标准和套期保值交易保证金标准恢复至调整前水平；铂、钯期货合约涨跌停板幅度调整为12%，投机交易保证金标准、套期保值交易保证金标准调整为14%。

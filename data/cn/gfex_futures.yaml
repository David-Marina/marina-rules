    quote: '各会员单位： 经研究决定，自2026年7月9日交易时起，多晶硅期货PS2607、PS2608、PS2609、PS2610、PS2611、PS2612、PS2701、PS2702、PS2703、PS2704、PS2705、PS2706合约的交易手续费标准调整为成交金额的万分之一、日内平今仓交易手续费标准维持成交金额的万分之二点五；碳酸锂期货LC2607、LC2608、LC2609、LC2610、LC2611、LC2612、LC2701、LC2702、LC2703、LC2704、LC2705、LC2706合约的交易手续费标准调整为成交金额的万分之一点六、日内平今仓交易手续费标准维持成交金额的万分之三点二。 '

    publisher: 广州期货交易所（存档）
    title: 关于2024年春节假期前后调整相关期货合约涨跌停板幅度、交易保证金标准和交易手续费标准的通知
    date: '2024-02-05'
    kind: official
    quote: 各会员单位： 经研究决定，交易所将在2024年春节休市前后对各品种期货合约涨跌停板幅度、交易保证金标准、交易手续费标准做如下调整： 自2024年2月7日（星期三）结算时起，工业硅期货合约涨跌停板幅度调整为9%，交易保证金标准调整为11%；碳酸锂期货合约涨跌停板幅度调整为15%，交易保证金标准调整为16%。
      2024年2月19日（星期一）恢复交易后，在各品种期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，工业硅期货合约涨跌停板幅度调整为6%，投机交易保证金标准调整为8%，套期保值交易保证金标准调整为7%；碳酸锂期货合约涨跌停板幅度调整为10%，投机交易保证金标准调整为12%，套期保值交易保证金标准调整为11%。
      自2024年2月19日（星期一）交易时起，碳酸锂期货LC2407合约的交易手续费标准调整为成交金额的万分之一点六，日内平今仓交易手续费标准调整为成交金额的万分之一点六。 如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。
    content_sha256: 7c2f83bb40c7116981a4f9da24e553105e28d95b71512235e939646f0aa7b5d9
    hash_kind: text
  - url: https://web.archive.org/web/20240531224534id_/http://www.gfex.com.cn/gfex/tzts/202307/94483627ee6b4c9c807e4ae12e48c776/files/3.%E5%B9%BF%E5%B7%9E%E6%9C%9F%E8%B4%A7%E4%BA%A4%E6%98%93%E6%89%80%E7%A2%B3%E9%85%B8%E9%94%82%E6%9C%9F%E8%B4%A7%E3%80%81%E6%9C%9F%E6%9D%83%E4%B8%9A%E5%8A%A1%E7%BB%86%E5%88%99.pdf

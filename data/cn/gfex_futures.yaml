    quote: '各会员单位： 经研究决定，自2025年7月21日交易时起，对部分期货合约交易手续费标准作出如下调整： 工业硅期货SI2509合约的日内平今仓交易手续费标准调整为成交金额的万分之一。 多晶硅期货PS2508合约的交易手续费标准调整为成交金额的万分之二，日内平今仓交易手续费标准调整为成交金额的万分之二。多晶硅期货PS2509合约的交易手续费标准调整为成交金额的万分之一点五，日内平今仓交易手续费标准调整为成交金额的万分之一点五。 '
    content_sha256: 8b8637a579aa4fe34b166560c5a845bcf7bbb44a94f79966d0318b06b5b5a180
    hash_kind: text
  notes: Contracts si2509 carry the fee specified in GFEX notice dated 2025-07-17; every listed contract-day agrees with the

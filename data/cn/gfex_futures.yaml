  value: 0.00025
  effective_from: '2025-07-25'
  effective_to: '2025-09-15'
  published_at: '2025-07-23'
  recorded_at: '2026-11-07'
  verification: single-source
  sources:
  - url: https://web.archive.org/web/20250801104127id_/http://www.gfex.com.cn/gfex/tzts/202507/3d7313cf35384467a7c739ee23abcc65.shtml
    publisher: 广州期货交易所（存档）
    title: 关于调整工业硅等品种期货合约涨跌停板幅度、交易保证金标准、交易手续费标准、交易限额的通知
    date: '2025-07-23'
    kind: official
    quote: '各会员单位： 经研究决定，对工业硅、多晶硅、碳酸锂期货相关合约的涨跌停板幅度、交易保证金标准、交易手续费标准和交易限额作如下调整： 自2025年7月25日结算时起，工业硅期货合约涨跌停板幅度调整为8%，投机交易保证金标准调整为10%，套期保值交易保证金标准调整为9%。
      自2025年7月25日交易时起，工业硅期货SI2509合约的交易手续费标准调整为成交金额的万分之二点五，日内平今仓交易手续费标准调整为成交金额的万分之二点五；多晶硅期货PS2509合约的交易手续费标准调整为成交金额的万分之四，日内平今仓交易手续费标准调整为成交金额的万分之四；碳酸锂期货LC2509合约的交易手续费标准调整为成交金额的万分之一点六，日内平今仓交易手续费标准调整为成交金额的万分之一点六。
      自2025年7月25日交易时起，非期货公司会员或者客户在工业硅期货SI2509合约上单日开仓量不得超过3,000手，非期货公司会员或者客户在多晶硅期货PS2509合约上单日开仓量不得超过3,000手。该单日开仓量是指非期货公司会员或者客户当日在单个合约上的买开仓数量与卖开仓数量之和。套期保值交易、做市交易的单日开仓数量不受上述标准限制。具有实际控制关系的账户按照一个账户管理。
      如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。 '
    content_sha256: 656d6bbff5ee8308454caa8ea5fc258d85d76f8519ca6f4786906e8474eae19b
    hash_kind: text
  notes: Contracts si2509 carry the fee specified in GFEX notice dated 2025-07-23; every listed contract-day agrees with the
    settlement parameters; selector boundaries reflect notice changes or the expiry of named contracts, and an open end is
    checked only through 2026-11-02.

    kind: official
    quote: '各会员单位： 经研究决定，对碳酸锂期货相关合约的交易手续费标准及交易限额作如下调整： 自2025年11月24日交易时起，碳酸锂期货LC2601合约的交易手续费标准调整为成交金额的万分之三点二，日内平今仓交易手续费标准调整为成交金额的万分之三点二；碳酸锂期货LC2602、LC2603、LC2604、LC2605合约的交易手续费标准调整为成交金额的万分之一点六，日内平今仓交易手续费标准调整为成交金额的万分之一点六。
      自2025年11月24日交易时起，非期货公司会员或者客户在碳酸锂期货LC2601合约上单日开仓量不得超过500手，在碳酸锂期货LC2602、LC2603、LC2604、LC2605合约上单日开仓量不得超过2,000手。该单日开仓量是指非期货公司会员或者客户当日在单个合约上的买开仓数量与卖开仓数量之和。套期保值交易、做市交易的单日开仓数量不受上述标准限制。具有实际控制关系的账户按照一个账户管理。 '

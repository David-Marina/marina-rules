    publisher: 广州期货交易所（存档）
    title: 关于2025年劳动节假期调整相关期货合约涨跌停板幅度和交易保证金标准的通知
    date: '2025-04-24'
    kind: official
    quote: 各会员单位： 根据《广州期货交易所风险管理办法》，经研究决定，交易所将在2025年劳动节假期休市前后对各品种期货合约涨跌停板幅度和交易保证金标准做如下调整： 自2025年4月29日（星期二）结算时起，工业硅期货合约涨跌停板幅度调整为8%，投机交易保证金标准调整为10%，套期保值交易保证金标准调整为9%；多晶硅期货合约涨跌停板幅度调整为9%，投机交易保证金标准调整为11%，套期保值交易保证金标准调整为10%；碳酸锂期货合约涨跌停板幅度调整为10%，投机交易保证金标准调整为12%，套期保值交易保证金标准调整为11%。
      2025年5月6日（星期二）恢复交易后，在各品种期货持仓量最大的合约未出现涨跌停板单边无连续报价的第一个交易日结算时起，上述品种期货合约涨跌停板幅度、投机交易保证金标准和套期保值交易保证金标准恢复至调整前水平。
      表：我所劳动节前后各品种期货合约风控参数对比 品种 现行标准 长假期间标准 长假后标准 涨跌停板 交易保证金 涨跌停板 交易保证金 涨跌停板 交易保证金 投机 保值 投机 保值 投机 保值 工业硅 6% 8% 7%
      8% 10% 9% 6% 8% 7% 多晶硅 7% 9% 8% 9% 11% 10% 7% 9% 8% 碳酸锂 8% 10% 9% 10% 12% 11% 8% 10% 9% 如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。
    content_sha256: 51e01f979b0f57fcbd1d122578bee3ff5b7b48765b5f864cac66168ac6633197

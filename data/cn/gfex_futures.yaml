    quote: 各会员单位： 经研究决定，自2025年7月14日结算时起，多晶硅期货合约涨跌停板幅度调整为9%，投机交易保证金标准调整为11%，套期保值交易保证金标准调整为10%。 如遇上述涨跌停板幅度、交易保证金标准与现行执行的涨跌停板幅度、交易保证金标准不同时，则按两者中幅度大、标准高的执行。

    is collected at the preceding settlement. For SC/LU this usually excludes one nearest expiry, and for NR/BC the delivery
    month and preceding-month ladder apply; exclusion is by calendar month, not a fixed contract count. Brokers may add their
    own margin. The notice preserves exceptions for specified contracts. The SC/LU November contracts are already inside the
    pre-delivery margin ladder; eligible general months restore to the observed pre-holiday level. No corresponding uniform
    price-band record is inferred where the named contracts still differ. The restoration is conditional on the first post-holiday
    trading day without a one-sided market; its effective date is confirmed by daily data. The cited risk/trading rules supply
    the exclusion method, not independent verification of the numeric rate. Temporary one-sided-market increases are not separate
    records. If every eligible contract is excluded, carry the preceding observable regime; this is not a claim that each
    excluded contract has that numeric rate.

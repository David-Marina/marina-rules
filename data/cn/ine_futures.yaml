    quote: 第二十七条新上市期货合约第一个交易日的涨跌停板为合约规定的涨跌停板的2倍。当日有成交的，下一交易日涨跌停板恢复到期货合约规定的涨跌停板；当日结算价按照《上海国际能源交易中心结算细则》中当日有成交的期货合约当日结算价确定方式确定。当日无成交的，下一交易日执行当日的涨跌停板；当日结算价参照《上海国际能源交易中心结算细则》中当日无成交的期货合约当日结算价确定方式确定，在适用该部分规定时，新上市合约第一个交易日的挂牌基准价视为该期货合约上一交易日的结算价。

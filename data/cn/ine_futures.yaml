    kind: official
    quote: 自2024年9月27日（星期五）收盘结算时起 … ，交易保证金比例和涨跌停板幅度调整如下：国际铜期货合约的涨跌停板幅度调整为8%，套保交易保证金比例调整为9%，投机交易保证金比例调整为10%

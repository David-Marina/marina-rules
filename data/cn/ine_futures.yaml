    kind: official
    quote: 第二十七条新上市期货合约第一个交易日的涨跌停板为合约规定的涨跌停板的2倍。当日有成交的，下一交易日涨跌停板恢复到期货合约规定的涨跌停板；当日结算价按照《上海国际能源交易中心结算细则》中当日有成交的期货合约当日结算价确定方式确定。当日无成交的，下一交易日执行当日的涨跌停板；当日结算价参照《上海国际能源交易中心结算细则》中当日无成交的期货合约当日结算价确定方式确定，在适用该部分规定时，新上市合约第一个交易日的挂牌基准价视为该期货合约上一交易日的结算价。
    content_sha256: 0adf96a456beb87ae493a176fdec28bee007546a6454f442ab05faf456bfe9b6
    hash_kind: bytes
  notes: Ordinary general-contract symmetric daily price limit as a fraction of previous settlement, dated by the parameter
    file TRADINGDAY. Exclude the previous trading day's one-sided contracts and initial listing double bands continuing until
    the first ordinary band; exclude the EC expiry-day special band. The restoration is conditional on the first post-holiday
    trading day without a one-sided market; its effective date is confirmed by daily data. The cited risk/trading rules supply
    the exclusion method, not independent verification of the numeric rate. Temporary one-sided-market increases are not separate
    records. If every eligible contract is excluded, carry the preceding observable regime; this is not a claim that each

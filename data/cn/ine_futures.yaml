# INE commodity futures (MIC XINE), per product scope: crude oil, low sulphur fuel oil, TSR 20 rubber, bonded copper,
# container freight index (Europe line, listed 2023-08-18).
# Rules: speculative margin, ordinary-day price limits, sessions (incl. night session), same-day round trips, and
# exchange trading fees and close-today fees (speculative only; hedge fees and declaration fees not included).
# Fees that differ between contracts of one product carry a `contracts` selector (schema 1.2, docs/SCHEMA.md).
# Sources: daily settlement-parameter / trade-argument files, notices and INE rules; special days appear only in notes.
schema: 1.2
market: XINE
asset_class: commodity_futures
records:
- id: cn.futures.margin_ratio.ine_sc.2023-12-28
  scope: ine_sc
  rule: margin_ratio
  value: 0.11
  effective_from: '2023-12-28'
  effective_to: '2024-01-02'
  published_at: '2023-12-27'
  recorded_at: '2026-11-03'
  verification: verified
  sources:
  - url: https://www.shfe.com.cn/publicnotice/notice/202312/t20231227_801168.html
    publisher: 上海国际能源交易中心
    title: 上海国际能源交易中心发布关于2024年元旦期间有关工作安排的通知
    date: '2023-12-27'
    kind: official
    quote: 自2023年12月28日（星期四）收盘结算时起 … ，涨跌停板幅度和交易保证金比例调整如下：原油、低硫燃料油期货合约的涨跌停板幅度调整为9%，套保交易保证金比例调整为10%，投机交易保证金比例调整为11%
    content_sha256: 7a648ad314f455bf979e949db77e18bf04c0f763dfa3f6f5b24062bd52681b7a
    hash_kind: text
  - url: https://www.ine.cn/data/tradedata/future/dailydata/js20231228.dat
    publisher: 上海国际能源交易中心
    title: 期货结算参数（20231228）
    date: '2023-12-28'
    kind: official
    quote: '"INSTRUMENTID":"sc2612                        " … "SPECLONGMARGINRATIO":0.11 … "SPECSHORTMARGINRATIO":0.11'
    content_sha256: b65bee2d8a615e6cee7d4408419bad616ca56e719840a2cae78885c83b2f2c13
    hash_kind: bytes
  - url: https://www.shfe.com.cn/upload/20230811/1691749596806.doc
    publisher: 上海国际能源交易中心
    title: 上海国际能源交易中心风险控制管理细则（2023年8月11日修订）
    date: '2023-08-11'
    kind: official
    quote: 第五条某期货合约交易保证金标准应当予以调整的，能源中心在新的交易保证金标准执行前一交易日结算时对该期货合约的所有持仓按新标准进行结算；保证金不足的，相关会员应当在下一个交易日开市前补足。 … 第六十四条原油期货合约上市运行不同阶段的交易保证金收取标准按照下表执行：交易时间段原油期货最低交易保证金比例合约挂牌之日起5%交割月份前第一月的第一个交易日起10%最后交易日前第二个交易日起20%
    content_sha256: d5262f16bd212280b989d877be2bd6a41f01c54694478b686b19db8011ef170f
    hash_kind: bytes
  notes: Exchange speculative (non-hedge / 一般持仓) margin as a fraction of contract value. Exclude delivery and pre-delivery-month
    contracts according to the INE risk-control margin ladder, evaluated for the next trading day because the new standard
    is collected at the preceding settlement. For SC/LU this usually excludes one nearest expiry, and for NR/BC the delivery
    month and preceding-month ladder apply; exclusion is by calendar month, not a fixed contract count. Brokers may add their
    own margin. The cited risk/trading rules supply the exclusion method, not independent verification of the numeric rate.
    Temporary one-sided-market increases are not separate records. If every eligible contract is excluded, carry the preceding
    observable regime; this is not a claim that each excluded contract has that numeric rate.

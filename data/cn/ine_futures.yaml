    title: 上海国际能源交易中心风险控制管理细则（2023年8月11日修订）
    date: '2023-08-11'
    kind: official
    quote: 第五条某期货合约交易保证金标准应当予以调整的，能源中心在新的交易保证金标准执行前一交易日结算时对该期货合约的所有持仓按新标准进行结算；保证金不足的，相关会员应当在下一个交易日开市前补足。 … 第八十五条集运指数（欧线）期货合约上市运行不同阶段的交易保证金收取标准按照下表执行：交易时间段集运指数（欧线）期货最低交易保证金比例合约挂盘之日起12%最后交易日前第七个交易日起20%最后交易日前第二个交易日起30%第八十六条集运指数（欧线）期货合约最后交易日涨跌停板幅度为上一交易日结算价的±20%。
    content_sha256: d5262f16bd212280b989d877be2bd6a41f01c54694478b686b19db8011ef170f
    hash_kind: bytes
  notes: Exchange speculative (non-hedge / 一般持仓) margin as a fraction of contract value. For EC, exclude contracts from settlement
    eight trading days before expiry (the margin ladder starts seven trading days before expiry, applied at the preceding
    settlement); exclude the expiry-day 20% band. Do not discard the two nearest contract months. Brokers may add their own
    margin. The cited risk/trading rules supply the exclusion method, not independent verification of the numeric rate. Temporary
    one-sided-market increases are not separate records. If every eligible contract is excluded, carry the preceding observable
    regime; this is not a claim that each excluded contract has that numeric rate.

    title: 上海国际能源交易中心发布关于2025年春节期间有关工作安排的通知
    date: '2025-01-22'
    kind: official
    quote: 自2025年1月24日（星期五）收盘结算时起 … 原油、低硫燃料油期货合约的涨跌停板幅度调整为10%，套保交易保证金比例调整为11%，投机交易保证金比例调整为12%
    content_sha256: f6dfd51d2d032562ec2ec62a73f2f970fb8bbeef96e5279afea05a7423d44abe
    hash_kind: text

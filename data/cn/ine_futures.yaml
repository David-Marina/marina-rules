    quote: 自2025年1月24日（星期五）收盘结算时起 … ，交易保证金比例和涨跌停板幅度调整如下：国际铜期货合约的涨跌停板幅度调整为10%，套保交易保证金比例调整为11%，投机交易保证金比例调整为12%

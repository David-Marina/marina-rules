  notes: 'single-source (published_at = the 2023 halving notice, whose stated end date restores the base rate): inferred from
    two notices — the 2023 halving ended 2023-12-31 and the 2024 halving started 2024-01-08 — so the four trading days in between
    paid the base rate; CFFEX publishes settlement parameters only on the days they change: 2024-01-02..05 return an empty <settlementproperty/>,
    and the next file after 2023-12-18 is 2024-01-08, so those days ran on the 2023-12-18 parameters, which show 1/10,000 for
    every listed IF/IH/IC/IM contract (CSV cited). Those files give per-contract rates by delivery date, so the 2024-01-01 start
    is still inferred from the two notices; no index-futures delivery fell in the window. Settlement-XML field JG_TRANSFEE_RATE
    is the DELIVERY fee (not the close-today fee): it halves exactly on the dates of the CFFEX delivery-fee halving notices.
    Halving applies by delivery date, so far-month contracts whose delivery falls outside an announced halving year still show
    1.0E-4 in the XML.'

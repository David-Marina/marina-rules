  sources:
  - url: http://www.sse.com.cn/lawandrules/sselawsrules2025/trade/universal/c/c_20260424_10816492.shtml
    publisher: 上交所
    title: 上海证券交易所交易规则（2026年修订）附件1 第3.3.13、3.3.17条
    date: '2026-04-24'
    kind: official
    quote: 涨跌幅限制价格=前收盘价×（1±涨跌幅限制比例）……3.3.17 涨跌幅限制价格、有效申报价格范围的计算结果按照四舍五入原则取至申报价格最小变动单位。
    content_sha256: fdc560bac9d15fa07526c8c9589c188cbc10b774404290f522858f8181c90822
    hash_kind: text
    fetched_sha256: 68427c4e509b625e9fa5c2f008c64070a66ae90893a7cc250949f7ddc5b09d12
  - url: http://www.sse.com.cn/aboutus/mediacenter/hotandd/c/c_20150912_3988628.shtml
    publisher: 上交所
    title: 关于修订《上海证券交易所交易规则》若干条款的通知（2012-12-14，2013-01-01 生效）
    date: '2012-12-14'
    kind: official
    quote: 股票、基金涨跌幅价格的计算公式为：涨跌幅价格=前收盘价×（1±涨跌幅比例）。计算结果按照四舍五入原则取至价格最小变动单位。
    content_sha256: 102bb3d6deec6977d26264ea434dcb1bfcf5585a1ce8f03333cb7a8a79e37133
    hash_kind: text
    fetched_sha256: 0da312ffc2524ea3798302043932bb6214b6eae8d8e4f340bcd05c8b505d7f16
  notes: 'limit = round_half_up(prev_close × (1 ± pct)) to the tick (SSE rules 3.3.13/3.3.17; same wording in the 2012-12-14 revision). 2026 rules add: if |limit − prev_close| < one tick, use prev_close ± one tick. Banker''s rounding differs by CNY 0.01 on ~0.6% of days (docs/audit-2026-10-24.md). ETFs and convertibles tick at 0.001. published_at: not located — the 1996 limit notices (dated 1996-12-13 in the SSE/SZSE repeal registers) are not online, so whether they contained the half-up rounding rule is unknown; the earliest official rounding text found is the 2006 trading rules (2006-05-15), after effective_from. Searched 2026-10-29: SSE/SZSE repeal registers, chronicles 1996–2006.'

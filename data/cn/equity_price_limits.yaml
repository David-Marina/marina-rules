    quote: 2.4.2 证券采用竞价交易方式的，每个交易日的9:15至9:25为开盘集合竞价时间，9:30至 11:30、13:00至 14:57为连续竞价时间，14:57至 15:00为收盘集合竞价时间。
    content_sha256: 854bf2946edb14c8c73b2d5116ea2c29ae1c44ac51502519971a15e6edc8678f
    hash_kind: bytes
  - url: http://docs.static.szse.cn/www/disclosure/notice/general/W020180328432865528017.pdf

    title: '上海证券交易所关于废止部分业务规则的公告（第一批）附件：废止的业务规则目录 第85项'
    date: '2003-06-28'
    kind: official
    quote: '85.关于实行股票交易T＋1交收制度有关事项的通知（1994.12.8上证交（94）字第3023号）'
    content_sha256: 93a97bc0b54e37331421d06708d0ff0126312ba7cc39e4bae917655f4a4a915b
    hash_kind: bytes
  notes: 'A shares (and, from the same date, listed funds unless listed as same-day-rotation): shares bought on day T can be sold from T+1 — ''min_holding_days: 1''. Effective 1995-01-01 per SZSE''s own 1995 chronicle (''A 股及基金交易由 T+0 交收改为 T+1 交收''); the rule text itself is hashed from the SZSE 2011 and SSE 2023/2026 rules (3.1.4). single-source on the 1995 START DATE (one exchange chronicle; the State Council Securities Committee decision is not hashed). Applies to every A-share scope: main board, ChiNext, STAR, BSE, ST, delisting. Same-day-rotation fund types are excluded by name in 3.1.5 and are not encoded (see G-0013). published_at basis: official-register — SSE 2003-06-28 repeal register batch 1, item 85: 关于实行股票交易T＋1交收制度有关事项的通知 （1994.12.8 上证交（94）字第3023号）. The notice text is not online and no SZSE notice date was found in the SZSE repeal registers or its 1994/1995 chronicles; press reports (not used) say both exchanges announced T+1 on 1994-09-30. So 1994-12-08 rests on the SSE register only — single-source for the publication fact, and for XSHE an assumption that the joint decision was public no later.'

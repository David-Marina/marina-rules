    title: 新版《交易规则》对价格过低证券的价格涨跌幅限制或有效竞价范围是如何设置？
    date: '2011-03-22'
    kind: official
    quote: 当证券价格过低，导致涨跌幅限制价格与前收盘价之差的绝对值低于价格最小变动单位时，以前收盘价增减一个价格最小变动单位为涨跌幅限制价格

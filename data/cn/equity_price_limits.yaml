  - url: https://www.szse.cn/disclosure/notice/general/t20060515_499577.html
    publisher: 深交所
    title: 关于发布《深圳证券交易所交易规则》的通知（附2006年版交易规则全文）第3.1.5条
    date: '2006-05-15'
    kind: official
    quote: 3.1.5 债券、债券回购实行当日回转交易，B股实行次交易日起回转交易。
    content_sha256: a399b3257a2cc9e07d741d3665b4ff4faff9a38d7504fa2a911bd94f1f224e2f
    hash_kind: text
  - url: http://www.szse.cn/lawrules/rule/repeal/rules/P020231230545258674434.pdf
    publisher: 深交所
    title: 关于发布《深圳证券交易所债券交易实施细则》的通知（深证会〔2012〕144号）第四条
    date: '2012-11-29'
    kind: official
    quote: 第四条 国债、地方政府债券、企业债券、公司债券、可转换公司 债券、分离交易的可转换公司债券及本所认可的其他债券品种，可以进 行现券和回购交易。
    content_sha256: 07dd5ea6932bd69e1339d751c8cbb0a539c4e29a660de1366c25cc1ec81dfed3
    hash_kind: bytes
  - url: http://www.szse.cn/disclosure/notice/bond/t20060920_509176.html
    publisher: 深交所
    title: 关于发布《深圳证券交易所债券、债券回购交易实施细则》的通知 第4.1条
    date: '2006-09-20'
    kind: official
    quote: 本细则所称债券包括国债、企业债，不包括可转换公司债券。
    content_sha256: f47ae6ff5c536b0bb34ff167190ccd47959ee1f586a4f41275c59ffa60a5471d
    hash_kind: text
  notes: 'SZSE: rule 2.3.2 (2006) / 2.4.2 (2011, 2013) sets one schedule for every security traded by competitive auction (证券采用竞价交易方式的),
    bonds included (2006 rules list 债券 among the traded products). Same windows as cn.session.stock.szse.2006-07-01. single-source:
    convertibles are covered as 债券/证券, not by name before 2012-12-10; the SZSE bond-trading rules (2012/2016/2020) name them
    (art. 4) and give the same windows. SZSE 2006-10-09..2012-12-10: the SZSE bond-trading rules of 2006 (4.1) define 债券 as
    国债、企业债 and EXCLUDE convertibles, which weakens the reading that convertibles were 债券 in that window (the 2008 SZSE convertible
    rules 深证上〔2008〕152号 that would govern them were not found). From 2012-12-10 the SZSE bond-trading rules (深证会〔2012〕144号,
    2016 and 2020 revisions) list 可转换公司债券 by name (art. 4) under the bond-spot provisions. Continued by the 2022 convertible
    rules (cn.session.convertible.szse.2022-08-01, same windows renamed 匹配).'

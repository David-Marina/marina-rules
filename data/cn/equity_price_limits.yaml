  notes: 'Before the 2022 convertible rules, convertibles traded as 债券 under the general trading rules of each exchange, and
    bonds rotated same-day: SZSE 2006 3.1.5 (债券、债券回购), 2011/2012/2013 3.1.4 (债券竞价交易), 2015 list; SSE 2006 3.1.5 (债券和权证), 2020
    3.1.5 (一)债券. SSE bond-trading rules (2019) art. 2 route listed convertibles to the trading rules, and the SSE 2022 notice
    says convertibles thereby LEAVE the trading rules'' bond provisions — confirming they were under them before. Named official
    texts exist only from 2012-12-10 on SZSE (bond-trading rules art. 4 + 20; SZSE convertible rules 2017/2018 art. 12 可转换公司债券实行当日回转交易)
    and from 2020-07 on SSE (investor hotline; 上证发〔2020〕57号). single-source for the earlier parts. SZSE 2006-10-09..2012-12-10:
    the SZSE bond-trading rules of 2006 (4.1) define 债券 as 国债、企业债 and EXCLUDE convertibles, which weakens the reading that convertibles
    were 债券 in that window (the 2008 SZSE convertible rules 深证上〔2008〕152号 that would govern them were not found). From 2012-12-10
    the SZSE bond-trading rules (深证会〔2012〕144号, 2016 and 2020 revisions) list 可转换公司债券 by name (art. 4) under the bond-spot provisions.
    Applies to convertible_day1 too.'

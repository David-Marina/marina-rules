  notes: 'Before the 2022 convertible-bond trading rules convertibles had NO daily price band. The 2006 rules of both exchanges
    limit only 股票、基金 (SZSE 3.3.14, SSE 3.4.13) and treat bonds as 无价格涨跌幅限制的证券 (SZSE 3.4.4 (二), SSE 3.4.15 (二)); SZSE states
    it for convertibles in terms (2020 Q&A: 本所可转债交易不设价格涨跌幅限制; 2020-10-30 notice: 无价格涨跌幅限制的可转换公司债券). Named official texts: SZSE
    from 2012-12-10 (bond-trading rules 深证会〔2012〕144号 art. 4 + 18), SZSE notice 深证会〔2020〕402号 and SSE 上证发〔2020〕57号 (risk-disclosure
    terms, from 2020-10-26: 可转债…无涨跌幅限制), SSE investor hotline 2020-07 (可转债属于买卖无价格涨跌幅限制的证券). single-source because before those
    dates the SSE side (2006 → 2020-07) rests on convertibles being 债券 in the 2006 text and on the monitoring rules'' ''无价格涨跌幅限制的其他债券'',
    the SZSE side 2006-10-09..2012-12-10 is weakened by the 2006 SZSE bond-trading rules 4.1, which exclude convertibles from
    债券, and continuity 2006→2022 is inferred from rule texts at both ends (SZSE 2006/2011/2012/2020; SSE 2006 + monitoring rules),
    not from every intervening SSE revision. Intraday halts are NOT a band and are not encoded: SSE monitoring rules art.3(三)
    halt at ±20% / ±30% vs previous close; SZSE 2020-11-02 onward halts at ±20% (30 min) / ±30% (to 14:57); earlier SZSE thresholds
    varied (深证会〔2020〕268号, repealed). Opening-auction collars (e.g. SZSE 2006 bonds ±30% of issue price on day 1, ±10% otherwise)
    are order-validity ranges, not limits. limit_price() returns None for this interval. Before 2006-07-01: G-0001.'

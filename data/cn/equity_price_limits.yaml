    rules 深证上〔2008〕152号 that would govern them were not found). From 2012-12-10 the SZSE bond-trading rules (深证会〔2012〕144号,
    2016 and 2020 revisions) list 可转换公司债券 by name (art. 4) under the bond-spot provisions. The 2017-06 consultation draft of
    the SZSE convertible rules still has 0.01 (art. 13), consistent with this record. Narrows former gap G-0025. The SZSE convertible-bond
    rules of 2008-10-28 (深证上〔2008〕152号, web.archive.org capture) art. 14 also state 0.01 for convertibles by name from 2008-10-28.'

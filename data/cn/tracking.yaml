# Tracking registry · China (A-share and Chinese futures). Not rules: excluded from the dataset digest.
#
# Each entry: up to which date the maintainer has checked the official sources of a market (MIC as on records; a
# '+' list covers each member) for rule changes. Optional `scopes`: scope names or 'family_*' patterns, for a market
# whose parts are followed to different dates; without it the entry covers every scope of the market. No two entries
# may cover the same (market, scope).
#   tracked_through  last date checked. On or before it, an open-ended record (effective_to: null) states what the
#                    sources said; after it, the record is a carry-forward, not a finding.
#   basis            how it was checked.
#   updated          the date this entry was last written (tracked_through <= updated).
# A market or scope with no entry is NOT tracked: nothing is defaulted. BJSE is tracked for its own stock-trading scopes
# only (the entry below); a record of scope `stock` whose market includes BJSE (stamp duty, transfer fee) is untracked
# for a BJSE query or a query without a market. Not tracked: CCFX (CFFEX index and treasury bond futures). See
# docs/SCHEMA.md "Tracking registry".
schema: 1
tracking:
- market: XSHG+XSHE
  tracked_through: '2026-11-20'
  basis: Listing pages of SSE trading rules and news, SZSE business rules and notices, CSDC notices and MOF
    announcements, diffed weekly (2026-11-16 against the 2026-11-14 snapshot, no new matching titles; 2026-11-23
    against the 2026-11-16 snapshot); new titles matching rule keywords reviewed by title (2026-11-20 margin-financing
    ratio, 2026-11-13 and 2026-11-20 CSDC bond registration and settlement fee waivers; none is a rule Marina
    records). A title-keyword check, not a reading of every notice.
  updated: '2026-11-23'
- market: BJSE
  scopes: [bse, st_bse, delisting_bse, ipo_day1_bse, delisting_day1_bse, bse_stock]
  tracked_through: '2026-11-18'
  basis: The rules in force in BSE's trading-management column, read in full on 2026-11-19 by following the
    previous / next links of the rule pages (25 documents, 2021-11-02 to 2026-10-16, none newer linked), and both
    editions of the trading rules compared article by article. Not read - superseded editions other than the 2021
    trial rules, BSE notices outside that column, and BSE fee notices.
  updated: '2026-11-19'
- market: XSGE
  tracked_through: '2026-11-18'
  basis: SHFE notices and daily settlement-parameter files, every trading day from 2024-01-02 to 2026-11-18.
  updated: '2026-11-19'
- market: XINE
  tracked_through: '2026-11-18'
  basis: INE daily settlement-parameter / trade-argument files, every trading day from 2024-01-02 to 2026-11-18. INE
    notices to 2026-11-02; from 2026-11-03 only those republished on shfe.com.cn were read, because the INE notice list
    refused automated access on 2026-11-19.
  updated: '2026-11-19'
- market: XZCE
  tracked_through: '2026-11-18'
  basis: CZCE daily settlement-parameter files, every trading day from 2024-01-02 to 2026-11-18; the notice list for
    2026-10-23 to 2026-11-17 read by title on 2026-11-19 and the notices on margins, bands, fees and listings read. Not
    read - the attachments of the business-rule amendments of 2026-11-06 and 2026-11-17.
  updated: '2026-11-19'
- market: GFEX
  tracked_through: '2026-11-18'
  basis: GFEX daily settlement parameters, every trading day from 2024-01-02 to 2026-11-18, and the notice list for
    2026-10-28 to 2026-11-18 read on 2026-11-19. Daily bands are not published; bands rest on notices.
  updated: '2026-11-19'

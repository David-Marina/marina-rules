  notes: 'Exchange base trading margin for non-hedge positions, as a fraction of contract value; brokers may add
    a markup. This scalar excludes contract-specific delivery-month increases, extraordinary risk measures and offsets
    for opposite positions. The exchange-applied 1.2% overrides the 1% contractual minimum. Before the 2018 revision
    the new-series pre-delivery ladder was 1.5% before the last ten days of the preceding month and 2% before the
    first trading day of the delivery month. From 2018-02-13, TF1806 and later use 2% from settlement two trading
    days before the delivery month; TF1803 retains the old ladder. Product-level coverage begins on 2015-09-12,
    the day after TF1509 expired: art. 9 sets the last trading day to the second Friday of the expiry month (2015-09-11).
    From 2015-03-16 through 2015-09-11, TF1512 and later used the new 1.2% ordinary band and base margin, while
    TF1506/TF1509 retained the 1.5% ordinary band and old base-margin regime until expiry. That coexistence interval
    is deliberately left without product-level records; see known_gaps.yaml. Delivery-month margin increases remain
    excluded.'

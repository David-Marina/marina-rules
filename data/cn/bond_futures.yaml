  sources:
  - url: http://www.cffex.com.cn/u/cms/www/202003/271701510v1q.pdf
    publisher: 中国金融期货交易所
    title: 中国金融期货交易所 2 年期国债期货合约交易细则（2018-08-06版本）
    date: '2018-08-06'
    kind: official
    quote: '第十九条 本合约的每日价格最大波动限制是指其每 日价格涨跌停板幅度，为上一交易日结算价的±0.5％。 合约上市首日涨跌停板幅度为挂盘基准价的±1％。上市 首日有成交的，于下一交易日恢复到合约规定的涨跌停板幅
      度；上市首日无成交的，下一交易日继续执行前一交易日的 涨跌停板幅度。如上市首日连续三个交易日无成交的，交易 4 所可以对挂盘基准价作适当调整。 '
    content_sha256: c4c90bcf52eb18429868cc5ed9daf562a6e79f8dd54c3c0caeefcc9e3fafd14e
    hash_kind: bytes
  - url: http://www.cffex.com.cn/cn/jystz/20180807/22445.html
    publisher: 中国金融期货交易所
    title: 关于2年期国债期货合约上市交易有关事项的通知
    date: '2018-08-07'
    kind: official
    quote: 2年期国债期货合约自2018年8月17日（星期五）起上市交易。
    content_sha256: 6a6e1c13250e9a1cd79ebea914d2c0e32af7d307fffab38e67cda610442c5fe8
    hash_kind: text
  notes: Ordinary-day symmetric band against the previous trading day's settlement price. Listing-day band is ±1%
    of the listing reference price; after a trade occurs the ordinary band resumes on the following day, otherwise
    the listing band continues; after three consecutive days without trades the exchange may adjust the reference
    price. The cited rules contain no separate last-trading-day band; the ordinary band applies, subject to exchange
    risk measures.

    quote: '第十九条 本合约的每日价格最大波动限制是指其每 日价格涨跌停板幅度，为上一交易日结算价的±3.5%。 合约上市首日涨跌停板幅度为挂盘基准价的±7%。上市 首日有成交的，于下一交易日恢复到合约规定的涨跌停板幅
      度；上市首日无成交的，下一交易日继续执行前一交易日的 4 涨跌停板幅度。如上市首日连续三个交易日无成交的，交易 所可以对挂盘基准价作适当调整。 '

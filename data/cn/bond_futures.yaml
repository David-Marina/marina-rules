  verification: verified
  sources:
  - url: http://www.cffex.com.cn/u/cms/www/202003/2717031907yv.pdf
    publisher: 中国金融期货交易所
    title: 中国金融期货交易所 5年期国债期货合约交易细则（2013-08-30版本）
    date: '2013-08-30'
    kind: official
    quote: '第二十一条 本合约的每日价格最大波动限制是指其 每日价格涨跌停板幅度，为上一交易日结算价的±2％。 合约上市首日涨跌停板幅度为挂盘基准价的±4％。上市 首日有成交的，于下一交易日恢复到合约规定的涨跌停板幅
      度；上市首日无成交的，下一交易日继续执行前一交易日的 涨跌停板幅度。如上市首日连续三个交易日无成交的，交易 所可以对挂盘基准价作适当调整。 '
    content_sha256: 83cdb1c5008f2478c53883510114ade899ae2ee3e705025d6b9a896628c3bd19
    hash_kind: bytes
  - url: http://www.cffex.com.cn/cn/jystz/20130902/17156.html
    publisher: 中国金融期货交易所
    title: 关于5年期国债期货合约上市交易有关事项的通知
    date: '2013-09-02'
    kind: official
    quote: 5年期国债期货合约自2013年9月6日（星期五）起上市交易。
    content_sha256: c87eaef523314bc808888e6692fd74cd31f71905350b7417a8736581cd396c9e
    hash_kind: text
  notes: Ordinary-day symmetric band against the previous trading day's settlement price. Listing-day band is ±4%
    of the listing reference price; after a trade occurs the ordinary band resumes on the following day, otherwise
    the listing band continues; after three consecutive days without trades the exchange may adjust the reference
    price. The cited rules contain no separate last-trading-day band; the ordinary band applies, subject to exchange
    risk measures.

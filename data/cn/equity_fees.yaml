  notes: 'SZSE A shares: 0.0255‰ of turnover per side, collected by CSDC as a share of the SZSE handling fee (从深圳市场A股交易经手费中分成) — not a separate line item for investors (PBC Wuhan). The rate is confirmed as 现行 on 2012-04-30 and 2012-08-02 and as the rate replaced on 2015-08-01; no official text dates its introduction, so effective_from is the coverage floor 2006-07-01 and the record is single-source. As a lower bound on what an investor paid it is valid (the handling fee is inside the commission). PDF quotes are pypdf-extracted text with line breaks collapsed to single spaces (verified against the hashed bytes). published_at: not located (2026-10-29 search: chinaclear.cn notices and fee tables incl. old_files/, SSE/SZSE repeal registers batches 1–7 and chronicles 1994–2012, MOF/CSRC archives). The CSDC texts cited only call the rate 现行; no founding notice found.'

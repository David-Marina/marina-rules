    kind: official
    quote: 于2015年8月1日起……A股交易过户费由沪市按照成交面值0.3‰、深市按照成交金额0.0255‰向买卖双方投资者分别收取，统一调整为按照成交金额0.02‰向买卖双方投资者分别收取。
    content_sha256: 957ae21a54fa26cec0a7d0cd655baae43ae5318f9f6dd53c315e4fd9fb0f65ee
    hash_kind: text
    fetched_sha256: 2fb942940a0aaabf7849b134a9e5c7597df8b92c9f2adb08004c82e8c7df4dca
  notes: SSE+SZSE unified at 0.02‰ of turnover, each side. Before 2015-08-01 SSE charged by par value (rule
    transfer_fee_par_value, cn.fee.transfer_fee_par_value.sse.*) and SZSE 0.0255‰ of turnover inside the exchange
    handling fee (cn.fee.transfer_fee_each_side.szse.2006-07-01). BJSE 2021-11-15..2022-04-29 is a separate record
    under family scope bse_stock (cn.fee.transfer_fee_each_side.bjse.2021-11-15, 0.025‰).
  effective_to: '2022-04-29'

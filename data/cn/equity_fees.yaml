  notes: "SZSE 可转债: commission not more than 0.1% (1‰) of turnover — SZSE's own fee table 深圳证券交易所收费（及代收税费）明细表 (szse.cn/main/aboutus/service/sjssf/, row 佣金 / 可转债, payer 投资者交证券公司), read from web.archive.org captures of szse.cn: the version dated 2006-12-30, the 2007-11-12 update (after the 2007-11-12 fixed-income fee change 深证会〔2007〕108号, which lowered 债券现货 to 0.2‰ but did not cover 可转债) and the 2013-11-14 update all state it. This is the exchange-set convertible commission delegated by 证监发〔2002〕21号 art. 2. single-source: dates are the table's own dates, not a filing's effective date; the founding filing was not found. effective_from 2006-12-30 = the earliest dated official statement (2006-07-01..2006-12-30 stays unresolved rather than back-dated). effective_to 2014-08-25 = the table version that no longer has a 佣金 section at all (the A-share 3‰ row disappeared too, so the removal looks editorial, not a repeal) — after it no official SZSE text states a convertible commission; that period is unresolved, not 'no cap'. No minimum (起点) is stated for 可转债 (A shares: 起点 5 元); the minimum is NOT recorded from that silence (unresolved)."

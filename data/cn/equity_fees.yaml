    title: 关于调整证券交易佣金收取标准的通知（证监发[2002]21号）
    date: '2002-04-04'
    kind: official
    quote: 一、a股、b股、证券投资基金的交易佣金实行最高上限向下浮动制度，证券公司向客户收取的佣金（包括代收的证券交易监管费和证券交易所手续费等）不得高于证券交易金额的3‰也不得低于代收的证券交易监管费和证券交易所手续费等。a股、证券投资基金每笔交易佣金不足5元的，按5元收取
    content_sha256: a9114f30f86cc643947d79cc7ca36e0a8ff0526b4bf06a7ee07b71c621acf9be
    hash_kind: text
  notes: '证监发〔2002〕21号 art. 1 covers 证券投资基金 with the same 3‰ cap as A shares (art. 8: from 2002-05-01).'

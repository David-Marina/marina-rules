    the CSDC Beijing notices of 2021-11-02 (施行 2021-11-15) do not state the rate → effective_from is the BSE opening date. published_at:
    not located (2026-10-29 search: chinaclear.cn — the 2021-11-02 北京市场证券登记结算业务收费及代收税费一览表 editor_file/20211102171333314.pdf
    returns 404; CSDC notice lists; bse.cn notices). Press (not used) cites that table for 0.025‰.'

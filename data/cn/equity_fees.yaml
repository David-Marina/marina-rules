    publisher: 中国结算
    title: 北京市场证券登记结算业务收费及代收税费一览表（2026年1月1日更新）
    date: '2026-01-01'
    kind: official
    quote: 证券交易印花税 A 股、挂牌公司股份、优先股、退市板块股份 按成交金额的 1‰向出让方收取，减半征收。
    content_sha256: c36ce244bf0c615b9a8837360b76717af6ec4d8986390d59614df16d36012229
    hash_kind: bytes
  notes: Halved to 0.05%. MOF/STA Announcement 2023 No.39 says 减半 (halved); 0.0005 is the arithmetic result, not a figure
    printed in the notice. The announcement halves securities-transaction stamp duty as a whole, so it covers BSE too;
    market extended to XSHG+XSHE+BJSE in step 2 (the CSDC Beijing fee table states the halved seller rate for BSE
    A shares). PDF quote is pypdf-extracted text with line breaks collapsed to spaces.

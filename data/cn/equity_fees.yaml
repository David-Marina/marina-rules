    publisher: 财政部
    title: 9月19日起证券交易印花税改为单边征收
    date: '2008-09-19'
    kind: official
    quote: 从２００８年９月１９日起……调整为单边征税，即对买卖、继承、赠与所书立的Ａ股、Ｂ股股权转让书据的出让方按千分之一的税率征收证券（股票）交易印花税，对受让方不再征税。
    content_sha256: 531c64dde8a5d3f931159b4587eb3ab411b0e69ae9b35c94a4482e70388e2e87
    hash_kind: text
    fetched_sha256: 4edaa053cbc7c2727e183a27f2e974aabb3534e4485522e3675f40ca7a6d8263
  notes: Unilateral (seller) 0.1%, A and B shares, SSE and SZSE. Preceded by the bilateral record
    cn.fee.stamp_duty_sell.2008-04-24; the buy side is 0 from this date (cn.fee.stamp_duty_buy.2008-09-19).
    Closed 2021-11-15 (was 2023-08-28) only so that BJSE can join; the same 0.1% continues for XSHG/XSHE as
    cn.fee.stamp_duty_sell.2021-11-15 (XSHG+XSHE+BJSE). No value changed for any SSE/SZSE date.
  effective_to: '2021-11-15'

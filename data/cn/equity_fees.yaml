  - url: https://fgk.chinatax.gov.cn/zcfgk/c100009/c5193058/content.html
    publisher: 国家税务总局政策法规库（全国人大常委会通过）
    title: 中华人民共和国印花税法
    date: '2021-06-10'
    kind: official
    quote: 本法所称证券交易，是指转让在依法设立的证券交易所、国务院批准的其他全国性证券交易场所交易的股票和以股票为基础的存托凭证。 证券交易印花税对证券交易的出让方征收，不对受让方征收。
    content_sha256: 66fe946219e679d25ecd14c5396ba0604bac4d51b30861f0231055a03a8140f1
    hash_kind: text
  notes: 'No buy-side duty. XSHG/XSHE: continuation of the 2008-09-19 notice. BJSE from its opening day: MOF/STA 2021 No.33
    applies the NEEQ stamp-duty rule to BSE; 财税〔2014〕47号 levies it on the seller only (由出让方). From 2022-07-01 the Stamp Duty
    Law art.3: 不对受让方征收.'

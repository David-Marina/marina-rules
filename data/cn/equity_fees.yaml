    publisher: 财政部 国家税务总局（中国政府网）
    title: 财政部 国家税务总局关于在全国中小企业股份转让系统转让股票有关证券（股票）交易印花税政策的通知（财税[2014]47号）
    date: '2014-05-27'
    kind: official
    quote: 在全国中小企业股份转让系统买卖、继承、赠与股票所书立的股权转让书据，依书立时实际成交金额，由出让方按 1‰的税率计算缴纳证券（股票）交易印花税。
    content_sha256: f41698f351fdfbb1b367890a64101f95235161e0a6b948a938f98e908f7bd71e

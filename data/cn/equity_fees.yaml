  sources:
  - url: http://www.mof.gov.cn/gkml/caizhengwengao/caizhengbuwengao2005/caizhengbuwengao20053/200805/t20080525_42735.htm
    publisher: 财政部 国家税务总局
    title: 财政部国家税务总局关于调整证券(股票)交易印花税税率的通知（财税[2005]11号）
    date: '2005-01-24'
    kind: official
    quote: 经国务院批准，决定从2005年1月24日起，调整证券(股票)交易印花税税率。对买卖、继承、赠与所书立的A股、B股股权转让书据，由立据双方当事人分别按1‰的税率缴纳证券(股票)交易印花税。
    content_sha256: 74e817eb4625cdef2721b86aa6463e180b2dd0b8ea5a841e9f567d1c396498ec
    hash_kind: text
  notes: '财税〔2005〕11号: 1‰ on each party (立据双方当事人分别) of A/B share transfer documents, SSE and SZSE. The MOF page serves the
    digit "1" (U+0031) before ‰ — checked byte-level in the fetched HTML, so it is quoted as "1‰"; an earlier note that the
    page prints a lowercase "l‰" is not borne out by the page as served on 2026-10-26. Value 0.001. Dates before 2006-07-01
    are outside the coverage target; the record starts on the notice date.'

  - url: http://www.cffex.com.cn/cn/hs300wd/20180202/21454.html
    publisher: 中国金融期货交易所
    title: 中金所在计算平今仓交易手续费时，平今仓数量是如何计算的？
    date: '2018-02-02'
    kind: official
    quote: 我所上市产品在计算平今仓交易手续费时，对当日平仓成交按成交时间先后顺序，逐笔采取“先平当日新开仓，再平历史仓”的方式计算平今仓数量，每笔成交的平今仓数量为该笔成交中平当日新开仓数量。
    content_sha256: cec12c084af99825532eb9968041cab8da0def95fffe5a1eaf0a7c91280c0520
    hash_kind: text
  - url: http://www.cffex.com.cn/cn/jystz/20150330/18795.html

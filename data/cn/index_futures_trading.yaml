  effective_to: '2016-01-08'
  published_at: '2015-12-04'
  recorded_at: '2026-11-03'
  verification: verified
  sources:
  - url: http://www.cffex.com.cn/u/cms/www/202003/27165403c9yk.pdf
    publisher: 中国金融期货交易所
    title: 沪深300股指期货合约交易细则（2015年12月4日修订）
    date: '2015-12-04'
    kind: official
    quote: 第二十二条 本合约的每日价格最大波动限制是指其 每日价格涨跌停板幅度，为上一交易日结算价的±7%。 到期月份合约最后交易日涨跌停板幅度为上一交易日 结算价的±20％。 交易所有权根据市场风险状况调整涨跌停板幅度。
    content_sha256: bca59bf6c36315e0214a38ec61b011ed6e4ddd7cebc302acda6c9735d2e4b927
    hash_kind: bytes
  - url: http://www.cffex.com.cn/u/cms/www/202003/27165403c9yk.pdf
    publisher: 中国金融期货交易所
    title: 沪深300股指期货合约交易细则（2015年12月4日修订）
    date: '2015-12-04'
    kind: official
    quote: 第二十六条 本细则自 2016年 1 月 1 日起实施。
    content_sha256: bca59bf6c36315e0214a38ec61b011ed6e4ddd7cebc302acda6c9735d2e4b927
    hash_kind: bytes
  notes: The ordinary daily maximum band is ±7% of the previous trading day's settlement price under the 2015-12-04 contract
    trading rules art. 22, not merely a circuit-breaker threshold. During 2016-01-01..2016-01-08 (exclusive), art. 21 also
    limits contract prices to ±5% of that settlement price until the CSI 300 benchmark triggers 5%; the 7% band then applies
    in the triggered direction, alongside trading halts. A single 0.07 cannot describe all admissible intraday prices. The
    last-trading-day band is ±20%; its afternoon session is exempt from circuit breakers. No separate special-day scope is
    encoded. Art. 26 sets effectiveness at 2016-01-01; the first actual trading day was 2016-01-04. The December 2015 revision
    omits the former quarterly-contract listing-day ±20% clause; do not carry that old provision forward.

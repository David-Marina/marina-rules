  verification: verified
  sources:
  - url: http://www.cffex.com.cn/u/cms/www/202003/27160931bnup.pdf
    publisher: 中国金融期货交易所
    title: 中国金融期货交易所交易细则（2010年修订）
    date: '2010-02-20'
    kind: official
    quote: 第十二条 沪 深300股指期货合约的每日价格最大波动 限制是指其每日价格涨跌停板幅度，为上一交易日结算价的 ±10%。
    content_sha256: 3450249eb6b3cf1e630fe1adaf5c297f8e3442cd416e280db54ce73e1805f1e2
    hash_kind: bytes
  - url: http://www.cffex.com.cn/cn/jystz/20100326/10719.html
    publisher: 中国金融期货交易所
    title: 关于沪深300股指期货合约上市交易有关事项的通知
    date: '2010-03-26'
    kind: official
    quote: 沪深300股指期货合约自2010年4月16日起上市交易。
    content_sha256: 65c6041bf83beef8f16582f6a77f42fe525f7f8b10524a98db1fe70327e0fbff
    hash_kind: text
  - url: http://www.cffex.com.cn/cn/hs300wd/20100205/17770.html
    publisher: 中国金融期货交易所
    title: 股指期货的涨跌停板幅度是10%还是20%？
    date: '2010-02-05'
    kind: official
    quote: 第一，股指期货合约的涨跌停板幅度为上一交易日结算价的±10％。第二，季月合约上市首日涨跌停板幅度为挂盘基准价的±20％。上市首日成交的，于下一交易日恢复到合约规定的涨跌停板幅度；上市首日无成交的，下一交易日继续执行前一交易日的涨跌停板幅度。第三，股指期货合约最后交易日涨跌停板幅度为上一交易日结算价的±20％。
    content_sha256: 2fd034262a0be031661b32b8b0f50551297d0decb89a030c34535d8b63728c59
    hash_kind: text
  - url: http://www.cffex.com.cn/cn/jystz/20100326/10719.html
    publisher: 中国金融期货交易所
    title: 关于沪深300股指期货合约上市交易有关事项的通知
    date: '2010-03-26'
    kind: official
    quote: 上市当日涨跌停板幅度，5月、6月合约为挂盘基准价的±10％，9月、12月合约为挂盘基准价的±20％。
    content_sha256: 65c6041bf83beef8f16582f6a77f42fe525f7f8b10524a98db1fe70327e0fbff
    hash_kind: text
  notes: Ordinary-day symmetric band of ±10% of the previous trading day's settlement price (2010-02-20 Trading Rules Implementing
    Details art. 12 and the 2010-02-05 official FAQ). On the listing day of a quarterly contract, the band is ±20% of the
    listing reference price; after trades occur, the ordinary band resumes on the next trading day; with no trades, the same
    band continues the next day. The last-trading-day band is ±20% of the previous trading day's settlement price. Special
    days have no separate scope; do not apply this ordinary-day value to them. The 2010-03-26 listing notice specifies first-day
    bands on 2010-04-16 of ±10% for the May/June contracts and ±20% for September/December, all relative to the listing reference
    price.
- id: cn.futures.price_limit_pct_of_prev_settlement.cffex_if.2016-01-01
  scope: cffex_if
  rule: price_limit_pct_of_prev_settlement
  value: 0.07

    hash_kind: text
  - url: http://www.cffex.com.cn/cn/hs300wd/20180202/21454.html
    publisher: 中国金融期货交易所
    title: 中金所在计算平今仓交易手续费时，平今仓数量是如何计算的？
    date: '2018-02-02'
    kind: official
    quote: 我所上市产品在计算平今仓交易手续费时，对当日平仓成交按成交时间先后顺序，逐笔采取“先平当日新开仓，再平历史仓”的方式计算平今仓数量，每笔成交的平今仓数量为该笔成交中平当日新开仓数量。
    content_sha256: cec12c084af99825532eb9968041cab8da0def95fffe5a1eaf0a7c91280c0520
    hash_kind: text
  - url: http://www.cffex.com.cn/cn/jystz/20150330/18795.html
    publisher: 中国金融期货交易所
    title: 关于上证50、中证500股指期货合约上市交易有关事项的通知
    date: '2015-03-30'
    kind: official
    quote: 上证50、中证500股指期货合约自2015年4月16日（星期四）起上市交易。
    content_sha256: 57f808b8729fc0ab8bbd5c6af45d90edaf819aed8428c89dacb4993a33f02a47
    hash_kind: text
  notes: 'Inference, not an explicit provision: the 2015-08-25 notice charges for closing positions opened the same day, and
    the 2018-02-02 official FAQ calculates fees by closing newly opened positions before historical positions. These support
    an inference of same-day round trips. No direct provision establishing this permission from the product''s listing day
    was found. effective_from is backdated to the listing day as part of that inference (single-source); published_at=null
    because no publication establishing that historical start was located. The start is not verified. Checked the 2010 trading
    rules, trading implementing details and settlement rules, the 2020 trading implementing details, eight pages of CSI 300
    FAQs and four pages of market-entry risk guidance, plus listing and fee notices.'

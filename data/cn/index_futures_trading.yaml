    date: '2016-01-07'
    kind: official
    quote: 为维护市场平稳运行，经中国证监会批准，中国金融期货交易所决定自2016年1月8日起，暂停实施沪深300、上证50、中证500股指期货熔断制度。现将有关事项通知如下： 一、《中国金融期货交易所交易规则》第五十六条、《中国金融期货交易所结算细则》第四十三条、《中国金融期货交易所风险控制管理办法》第八条、《中国金融期货交易所沪深300股指期货合约交易细则》第二十一条、《中国金融期货交易所上证50股指期货合约交易细则》第二十一条和《中国金融期货交易所中证500股指期货合约交易细则》第二十一条中的熔断制度暂停实施；
      二、《沪深300股指期货合约》、《上证50股指期货合约》和《中证500股指期货合约》中的每日价格最大波动限制由“上一个交易日结算价的±7%”调整为“上一个交易日结算价的±10%”。 《中国金融期货交易所沪深300股指期货合约交易细则》第二十二条第一款、《中国金融期货交易所上证50股指期货合约交易细则》第二十二条第一款和《中国金融期货交易所中证500股指期货合约交易细则》第二十二条第一款“本合约的每日价格最大波动限制是指其每日价格涨跌停板幅度，为上一交易日结算价的±7%”调整为“本合约的每日价格最大波动限制是指其每日价格涨跌停板幅度，为上一交易日结算价的±10%”；
      三、
    content_sha256: 48240551eb3532e5eda3beac53fb5d201e5d85271401710181d0c54e1af8280b
    hash_kind: text
  - url: http://www.cffex.com.cn/u/cms/www/202003/27165436e0mo.pdf
    publisher: 中国金融期货交易所
    title: 沪深300股指期货合约交易细则（2016年1月7日修订）
    date: '2016-01-07'
    kind: official
    quote: 第二十二条 本合约的每日价格最大波动限制是指其 每日价格涨跌停板幅度，为上一交易日结算价的±10%。 到期月份合约最后交易日涨跌停板幅度为上一交易日 结算价的±20%。 交易所有权根据市场风险状况调整涨跌停板幅度。
    content_sha256: 64d578bad21b30eba5bd51c22ebea51c1bda7512d8a8df12d622408910c1f96e
    hash_kind: bytes
  notes: The 2016-01-07 notice suspends circuit breakers from 2016-01-08 and restores the ordinary band from ±7% to ±10% of
    the previous trading day's settlement price. The last-trading-day band remains ±20% (contract trading rules revised 2016-01-07,
    art. 22; downloaded evidence in evidence/). The 2017 and 2018 versions retain the ordinary 10% band; no other ordinary-band
    changes were found. The listing reference price is not the previous trading day's settlement price. This record excludes
    listing days and does not extend the deleted quarterly- contract first-day 20% provision to the present.

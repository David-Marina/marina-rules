    kind: official
    quote: 第二十二条 本合约的每日价格最大波动限制是指其每 日价格涨跌停板幅度，为上一交易日结算价的±10%。 到期月份合约最后交易日涨跌停板幅度为上一交易日 结算价的±20%。 交易所有权根据市场风险状况调整涨跌停板幅度。
    content_sha256: 1a12c889d90b1d9da9a7508cfaca553ec0330f6690c249b95ef973a9c3cc5d89
    hash_kind: bytes
  notes: The 2016-01-07 notice suspends circuit breakers from 2016-01-08 and restores the ordinary band from ±7% to ±10% of
    the previous trading day's settlement price. The last-trading-day band remains ±20% (contract trading rules revised 2016-01-07,
    art. 22; downloaded evidence in evidence/). The 2017 and 2018 versions retain the ordinary 10% band; no other ordinary-band
    changes were found. The listing reference price is not the previous trading day's settlement price. This record excludes
    listing days and does not extend the deleted quarterly- contract first-day 20% provision to the present.

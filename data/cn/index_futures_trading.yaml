    kind: official
    quote: 为维护市场平稳运行，经中国证监会批准，中国金融期货交易所决定自2016年1月8日起，暂停实施沪深300、上证50、中证500股指期货熔断制度。现将有关事项通知如下： 一、《中国金融期货交易所交易规则》第五十六条、《中国金融期货交易所结算细则》第四十三条、《中国金融期货交易所风险控制管理办法》第八条、《中国金融期货交易所沪深300股指期货合约交易细则》第二十一条、《中国金融期货交易所上证50股指期货合约交易细则》第二十一条和《中国金融期货交易所中证500股指期货合约交易细则》第二十一条中的熔断制度暂停实施；
      二、《沪深300股指期货合约》、《上证50股指期货合约》和《中证500股指期货合约》中的每日价格最大波动限制由“上一个交易日结算价的±7%”调整为“上一个交易日结算价的±10%”。 《中国金融期货交易所沪深300股指期货合约交易细则》第二十二条第一款、《中国金融期货交易所上证50股指期货合约交易细则》第二十二条第一款和《中国金融期货交易所中证500股指期货合约交易细则》第二十二条第一款“本合约的每日价格最大波动限制是指其每日价格涨跌停板幅度，为上一交易日结算价的±7%”调整为“本合约的每日价格最大波动限制是指其每日价格涨跌停板幅度，为上一交易日结算价的±10%”；
      三、
    content_sha256: 48240551eb3532e5eda3beac53fb5d201e5d85271401710181d0c54e1af8280b

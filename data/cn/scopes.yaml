    requires: []
  shfe_ag:
    description: SHFE silver futures (AG), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  shfe_rb:
    description: SHFE rebar futures (RB), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  shfe_wr:
    description: SHFE wire rod futures (WR), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  shfe_hc:
    description: SHFE hot-rolled coil futures (HC), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  shfe_ss:
    description: SHFE stainless steel futures (SS), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  shfe_fu:
    description: SHFE fuel oil futures (FU), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.

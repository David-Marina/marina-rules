  # contract months.
  czce_ap:
    description: CZCE apple futures (AP), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  czce_cf:
    description: CZCE cotton futures (CF), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.

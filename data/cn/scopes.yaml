    description: INE low sulphur fuel oil futures (LU), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  ine_nr:
    description: INE TSR 20 rubber futures (NR), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []
  ine_bc:

    description: INE container freight index (Europe line) futures (EC, listed 2023-08-18), all contract months; Marina coverage from 2024-01-01 (sessions and same-day round trips from 2023-08-18). margin_ratio = speculative (non-hedge) position margin.
    requires: []
  # --- Zhengzhou Commodity Exchange (CZCE, MIC XZCE) agricultural, chemical and ferroalloy futures (czce_futures.yaml) ---
  # Product is read from the contract code (AP505 → AP; CZCE codes carry a three-digit year-month). Marina coverage starts

  # --- Shanghai International Energy Exchange (INE, MIC XINE) energy, rubber, copper and freight futures (ine_futures.yaml) ---
  # Product is read from the contract code (sc2409 → SC). Marina coverage starts 2024-01-01 (no record before;
  # EC sessions and same-day round trips from its listing day 2023-08-18);
  # margin_ratio records hold the speculative (non-hedge, 一般持仓) position margin of general contract months.
  ine_sc:
    description: INE crude oil futures (SC), all contract months; Marina coverage from 2024-01-01. margin_ratio = speculative (non-hedge) position margin.
    requires: []

    publisher: FINRA
    title: FINRA settlement-cycle implementation notice
    date: '2017-05-11'
    kind: official
    quote: from three business days after the trade date (T+3) to two business days after the trade date (T+2) … The amendments
      to these rules become effective on September 5, 2017.
    content_sha256: 4dc137f89efd8febfb2fc6b1ae459e7a29fc547f181b10ec02dfbb5880aeb1be
    hash_kind: text
  notes: Regular-way broker-dealer secondary-market settlement, measured in business days after trade date. Rule 15c6-1 exceptions
    and expressly agreed alternative settlement are excluded.
- id: us.settlement_cycle_days.us_stock.2024-05-28
  scope: us_stock
  rule: settlement_cycle_days
  value: 1
  effective_from: '2024-05-28'
  effective_to: null
  published_at: '2023-03-06'
  recorded_at: '2026-11-04'
  verification: verified
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2023-03-06/html/2023-03566.htm
    publisher: SEC (Federal Register / GPO)
    title: Shortening the Securities Transaction Settlement Cycle, 2023 final rule
    date: '2023-03-06'
    kind: official
    quote: compliance date of May 28, 2024, for the amendments to Exchange Act Rule 15c6-1(a) … Rule 15c6-1(a) will prohibit
      broker-dealers from effecting or entering into a contract for the purchase or sale of a security (other than an exempted
      security, a government security, a municipal security, commercial paper, bankers' acceptances, or commercial bills)
      that provides for payment of funds and delivery of securities later than the first business day after the date of the
      contract unless otherwise expressly agreed to by the parties at the time of the transaction.
    content_sha256: b11026c2d932a0a15215a90f8640d8e2bae0cbeec562ce1218841ee22422eb53
    hash_kind: text
  - url: https://www.finra.org/rules-guidance/notices/24-04
    publisher: FINRA
    title: FINRA settlement-cycle implementation notice
    date: '2024-02-26'
    kind: official
    quote: shortening of the standard settlement cycle for most U.S. securities transactions from T+2 to T+1 … The amendments
      to these rules will become operative on May 28, 2024, which is the compliance date the SEC announced for amended Rule
      15c6-1 and new Rule 15c6-2, or such later date as the SEC may announce for compliance with such rules.
    content_sha256: 03bf1f90c8f831a067ad8e277271abe7b562474a3243724e2fb3bb1f0cd4c76b
    hash_kind: text
  notes: Regular-way broker-dealer secondary-market settlement, measured in business days. May 28, 2024 is the compliance
    date, not the May 5, 2023 legal effective date. Exceptions and expressly agreed alternative settlement are excluded.

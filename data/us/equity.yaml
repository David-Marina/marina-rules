    kind: official
    quote: Effective January 15, 2010, the Section 31 fee will decrease the rate applicable to specified securities transactions
      on the exchanges and in the over-the-counter markets from$25.70 per million dollars to $12.70 per million dollars.
    content_sha256: edd66875f9ab719dbc5fe4dc463cad73d7a127c72fd5f9a5989488619bfb6415
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2010-03-04/html/2010-4530.htm
    publisher: SEC (Federal Register / GPO)
    title: '2010 mid-year fee adjustment: Appendix A historical fee period'
    date: '2010-03-04'
    kind: official
    quote: Determine the actual and projected aggregate dollar volume of sales between 1/15/10 and 3/31/10 to be $13,311,167,182,011.
      Multiply this amount by the fee rate of $12.70 per million dollars in sales during this period and get an estimate of
      $169,051,823 in actual and projected fees collected during 1/15/ 10 and 3/31/10.
    content_sha256: c4c1092e1fc5122f369e02fb167ba2e0b65b028034aa543eba65d158801d49e9
    hash_kind: text
  notes: 'Fraction of covered sell turnover under Exchange Act Section 31(b)/(c), not a registration fee. Exchanges and FINRA
    owe the SEC; brokers commonly pass the charge to sellers. Ordinary non-exempt secondary-market sales; broker rounding
    and additional commissions are not modelled. Dates follow the statutory order, including non-trading dates. The SEC order
    uses an appropriation-dependent start; FINRA confirms the resulting calendar date. Reassessment: the live FINRA notice
    directly states both USD 12.70 per million and 2010-01-15. The SEC mid-year order Appendix A independently applies USD
    12.70 to sales from 1/15/10 through 3/31/10, confirming the calendar applicability of its original appropriation-conditional
    FY2010 order. The later SEC retrospective is corroboration, not a new effective date.'

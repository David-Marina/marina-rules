  - url: https://www.govinfo.gov/content/pkg/FR-2012-06-28/html/2012-15806.htm
    publisher: SEC (Federal Register / GPO)
    title: SEC approval of FINRA 2012 TAF adjustment
    date: '2012-06-28'
    kind: official
    quote: The current TAF rate is $0.000095 per share for each sale of a Covered Security that is an equity security, with
      a maximum charge of $4.75 per trade. This rate, which was implemented by FINRA on March 1, 2012, represented a $0.000005
      per share increase over the previously effective rate of $0.000090 per share, while the per-transaction cap for Covered
      Securities that are equity securities increased by $0.25, from $4.50 to $4.75. … Under the current proposal, FINRA would
      increase the TAF rate by an additional $0.000024 per share, from $0.000095 per share to $0.000119 per share, while the
      per-transaction cap for transactions in Covered Securities that are equity securities would increase by $1.20, from
      $4.75 to $5.95. FINRA intends to make the proposal effective on July 1, 2012.
    content_sha256: b0a18b6d80f312310a3a85602c256c4cd8115b8808d1076e2a2a0f3e6c74d070

  - url: https://www.nyse.com/publicdocs/nyse/notifications/trader-update/Tick_Test.pdf
    publisher: NYSE Arca
    title: SEC Eliminates Tick Test Rule from Reg SHO
    date: '2007-06-29'
    kind: official
    quote: Effective Friday, July 6, 2007 the Securities and Exchange Commission (SEC) will eliminate the “tick test” from
      Regulation SHO. … NYSE Arca will eliminate all system validations for short sales on July 6, 2007. An order marked as
      short will be processed identically to sell orders marked as long.

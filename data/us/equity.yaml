  scope: us_stock
  rule: settlement_cycle_days
  value: 2
  effective_from: '2017-09-05'
  effective_to: '2024-05-28'
  published_at: '2017-03-29'
  recorded_at: '2026-11-04'
  verification: verified
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2017-03-29/html/2017-06037.htm
    publisher: SEC (Federal Register / GPO)
    title: Securities Transaction Settlement Cycle, 2017 final rule
    date: '2017-03-29'
    kind: official
    quote: Therefore, the Commission believes that September 5, 2017 is an appropriate compliance date by which the transition
      to a T+2 standard settlement cycle should be completed.
    content_sha256: 8f2f8bce1064f166985435a33a8585570ad6a0067929410a8713f09f064812d3
    hash_kind: text

    date: '2011-06-08'
    kind: official
    quote: The current TAF rate is $0.000075 per share for each sale of a Covered Security, with a maximum charge of [[Page
      33389]] $3.75 per trade. … FINRA has proposed to increase the TAF rate for Covered Securities that are equity securities
      by $0.000015 per share, from $0.000075 per share to $0.000090 per share, with a corresponding increase to the per-transaction
      cap for Covered Securities that are equity securities from $3.75 to $4.50. … FINRA proposes July 1, 2011 as the effective
      date of the adjusted TAF and will announce the effective date of the proposed rule change in a Regulatory Notice.
    content_sha256: 86a06b8c6559f00ffdfffb5afb4210961eba1e8f7459050edc5acf4629f4d904

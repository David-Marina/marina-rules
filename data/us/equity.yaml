- id: us.min_quote_increment.us_stock.2006-01-31
  scope: us_stock
  rule: min_quote_increment
  value:
    threshold: 1.0
    at_or_above: 0.01
    below: 0.0001
  effective_from: '2006-01-31'
  effective_to: null
  published_at: '2005-08-08'
  recorded_at: '2026-11-04'
  verification: single-source
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2024-10-08/html/2024-21867.htm
    publisher: SEC (Federal Register / GPO)
    title: Regulation NMS minimum pricing increments, 2024 adopting release
    date: '2024-10-08'
    kind: official
    quote: Thus, the Commission adopted Rule 612 in 2005, which established the minimum pricing increments of $0.01 for quotations
      and orders of NMS stocks priced at, or greater than, $1.00 per share, and $0.0001 for quotations and orders of NMS stocks
      priced under $1.00 per share.
    content_sha256: a894cbebbce6a9736a45c526d10100b23dcc6a3a2df3cc4551718e337e9d3d92
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2026-06-15/html/2026-11997.htm
    publisher: SEC (Federal Register / GPO)
    title: 2026 temporary exemptive relief from amended Rule 612
    date: '2026-06-15'
    kind: official
    quote: 'Rules 600(b)(89)(i)(F) and 612 implementing the amended minimum pricing increment: Until the first business day
      of November 2027.'
    content_sha256: b29d7a38e0632e52c200a521bf189bf684d0dd93a64a1d66dec23779d2100f39
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2005-08-08/html/05-15597.htm
    publisher: SEC (Federal Register / GPO)
    title: Regulation NMS Rule 612 compliance-date extension
    date: '2005-08-08'
    kind: official
    quote: the compliance date for the sub-penny rule is extended from August 29, 2005 to January 31, 2006.
    content_sha256: e7dce4d369e42baa997f9074b5352a5ea46da9c8b4750ac9ba87f16ec9e0d481
    hash_kind: text
  notes: Federal Rule 612 quotation/order increment floor, not a trade-price increment or a guarantee of each exchange order
    type. Exemptive retail programs and the stock-specific Tick Size Pilot are outside this baseline. The original compliance
    date was postponed to January 31, 2006 by the August 2005 release. The 2024 amendments were legally effective December
    9, 2024, but their compliance date has been deferred to the first business day of November 2027; no half-cent increment
    applies on or before 2026-11-04. The open end of this record does not encode the amended increments.
  unit: USD

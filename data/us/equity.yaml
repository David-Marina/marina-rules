  - url: https://www.govinfo.gov/content/pkg/FR-2011-08-17/html/2011-20902.htm
    publisher: FINRA (rule filing, Federal Register / GPO)
    title: 'SR-FINRA-2011-039: implemented Phase III trading pauses'
    date: '2011-08-17'
    kind: official
    quote: Effective August 8, 2011, the scope of the trading pause pilot was extended beyond the securities included in the
      S&P 500[reg] Index, the Russell 1000[reg] Index and the pilot list of Exchange Traded Products (``Phase I & II securities'')
      to all other NMS stocks (``Phase III securities''). In addition to widening the scope of the securities included in
      the trading pause pilot, the Phase III amendments apply a significantly higher percentage price move to trigger a trading
      pause for Phase III securities than is applicable to the Phase I & II securities. Specifically, while a ten percent
      price move within a five- minute period continues to apply to the Phase I & II securities, the Phase III securities
      are subject to a thirty percent price move where the security had a closing price the previous trading day of $1.00
      or more, and a fifty percent price move where the security had a closing price the previous trading day of less than
      $1.00.
    content_sha256: f748a910f708e2341f308b2ea02a7cc76cb7302e83e08cbd17e49fa51dd1e50b
    hash_kind: text
  - url: https://www.nyse.com/publicdocs/nyse/markets/nyse-arca/rule-interpretations/2011/RBE-11-05.pdf
    publisher: NYSE Arca
    title: 'Regulatory Bulletin RBE-11-05: all-NMS pauses effective August 8'
    date: '2011-08-04'
    kind: official
    quote: 'Effective August 8, 2011, Rule 7.11 will be applicable to all NMS stocks, i.e., all NMS eligible securities other
      than options as defined in Rule 600 of Regulation NMS. Accordingly, all securities that trade on the Exchange will be
      subject to such individual stock circuit breakers, including all exchange traded products. The Threshold Move applicable
      to a particular security will depend on certain factors, including the price of the security. The price determination
      will be based on the closing price of the security on the preceding trading day. If there is no closing price, the Exchange
      will use the last sale reported to the Consolidated Tape on the previous trading day. … The following chart summarizes
      the Threshold Moves that will be applicable to securities that trade on the Exchange beginning on August 8, 2011: Security
      Threshold Move S&P 500® Index, Russell 1000® Index, and 344 specified ETPs 10% All other NMS stocks priced equal to
      or greater than $1.00 30% All other NMS stocks priced less than $1.00 50% All other aspects of the Trading Pause rule
      will remain the same, including the times the rule is in effect and the manner by which the Exchange calculates the
      Threshold Move, triggers a Trading Pause, and reopens trading following a Trading Pause.'
    content_sha256: d53ba990d2f7f06f4c61888c67f90c3df9058c99cec2d46444c98680c55f7c7d
    hash_kind: bytes
  - url: https://www.finra.org/rules-guidance/notices/10-30
    publisher: FINRA
    title: 'Regulatory Notice 10-30: trading-pause pilot'
    date: '2010-06-17'
    kind: official
    quote: The exchanges' trading-pause rules apply from 9:45 a.m., ET until 3:35 p.m.
    content_sha256: adcb721c9f854b46f54e964dd5b493caa91b7cf4b0dca67042de680f5e192dc4
    hash_kind: text
  - url: https://www.nyse.com/publicdocs/nyse/notifications/trader-update/nyserule80c_faq.pdf
    publisher: NYSE
    title: Rule 80C trading-pause FAQ
    date: null
    kind: official
    quote: What triggers a trading pause? If a stock falls/rises 10% in a 5-minute time period a Market-wide Trading Pause
      will occur in the stock for a full 5 minutes. … Will the opening and closing print be subject to the 10% move threshold?
      No, the markets will begin calculating the threshold move at 9:45 AM and cease calculating at 3:35 PM. For stocks re-opening
      after a trading pause, the calculation will start again immediately.
    content_sha256: 8ba618f1fca1ff7f6958509ff4589bedb5c9b7e83c974a15cd323db9c4c82dd8
    hash_kind: bytes
  - url: https://www.nyse.com/api/notifications/public/summary/10026?systemId=1
    publisher: NYSE
    title: 'Reminder: Single Stock Trading Pauses'
    date: '2011-08-05'
    kind: official
    quote: Effective Monday, August 8, 2011 , NYSE, NYSE Amex, and NYSE Arca will expand the Single Stock Trading Pause functionality
      to all securities listed on those exchanges.
    content_sha256: 6b3b3d97b10a3a2cdced808263160652f11abbcff9848c8d2643245f0f5932b0
    hash_kind: bytes
  - url: https://www.nasdaqtrader.com/content/productsservices/trading/tradingpausefaqs.pdf
    publisher: Nasdaq
    title: Single Stock Trading Pause FAQ, updated February 22, 2013
    date: '2013-02-22'
    kind: official
    quote: Phase I of the program included stocks in the S&P 500 Index and Phase II, effective Tuesday, September 14, 2010,
      included securities in the Russell 1000 Index and select Exchange-Traded Products. On August 8, 2011, the pilot was
      expanded to the remaining Reg NMS securities (Phase III securities). For Phase III securities, the price move required
      to trigger a trading pause is 30% or more for securities priced at $1 or higher and 50% or more for securities priced
      less than $1. … NASDAQ did not use a phased roll-out and therefore implemented the trading pause functionality for all
      S&P 500 issues on June 14, 2010. … The functionality is in effect between 9:45 a.m., ET, and 3:35 p.m., ET. No single
      stock trading pause is called outside of these times. … If three prints in the prior five minutes deviate 10% or more
      from the last print and are through the National Best Bid or Offer (NBBO), a trading pause is initiated by the primary
      listing market. … If a last sale eligible execution is at or higher than the 10% threshold and is also at or within
      the NBBO within the five-minute period, NASDAQ will invoke a trading pause based on that single transaction. Trading
      pauses for Phase III securities will follow the same behavior based on the appropriate triggering percentage for the
      security.
    content_sha256: 6a42a191eea14be330ea46c0be5d7b3084752bfaea7180596b5ec72d20bcac6c
    hash_kind: bytes
  - url: https://www.nyse.com/api/notifications/public/summary/8656?systemId=1
    publisher: NYSE
    title: Single Stock (Volatility) Trading Pauses
    date: '2011-01-27'
    kind: official
    quote: Beginning on January 28, 2011, NYSE and NYSE Amex systems pause trading in a pilot stock only after three breaches
      of the Threshold Move within the preceding five-minutes.
    content_sha256: c78d2be9bb1ca56d1aed418eb0cf7bd3e50563c8f8ea98428550ca0443d5c5fc
    hash_kind: bytes
  - url: https://www.govinfo.gov/content/pkg/FR-2014-04-09/html/2014-07881.htm
    publisher: SEC (Federal Register / GPO)
    title: 'Seventh LULD amendment approval: replacement and all-NMS implementation'
    date: '2014-04-09'
    kind: official
    quote: The limit up-limit down mechanism set forth in the Plan would replace the existing single-stock circuit breaker
      pilot. … Accordingly, the Plan was not implemented across all NMS Stocks until December 8, 2013.
    content_sha256: 98db83a2e68059b55ea028803d7e6891f2f68f07e9627c7cc8ca920dc1c7ab7e
    hash_kind: text
  notes: National single-stock circuit-breaker pilot, not a daily limit or LULD band. The caller determines index and designated-ETP
    membership; Marina stores no constituents. S&P 500 and Russell 1000 membership may overlap, but both yield 10%; other_nms_stocks
    excludes all three named groups. Only securities belonging to the requested scope and primary-listed on XNYS or XNAS are
    covered. ETF shares are not index constituents merely because they track an index. A move of at least the threshold from
    a transaction price in the preceding five minutes is the threshold for a five-minute market-wide pause, subject to eligible-print
    and erroneous-trade filters. NYSE required three breaches from January 28, 2011. Nasdaq compares last-sale-eligible prints
    with the prior five minutes and uses its three-print/NBBO procedure, including a single-transaction trigger at or within
    the NBBO. These venue-specific filters are not additional percentage groups. The price bracket is determined using the
    previous trading day closing price, or the previous day consolidated last sale if no closing price exists. All times Eastern,
    ordinary full trading days; monitoring excludes the first 15 minutes and last 25 minutes, and starts again immediately
    after reopening. Significant imbalances can delay primary-market reopening; other markets may resume after ten minutes
    under the pilot conditions. The interval stops at LULD phase-in on 2013-04-08; mixed per-security migration is a known
    gap. On early scheduled closes, monitoring ends 25 minutes before the close; this ordinary-day value does not encode shortened
    calendars. The November 25, 2011 removal of rights and warrants does not change either supported scope.
  unit: USD

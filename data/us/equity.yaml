    title: 'Seventh LULD Amendment approval: actual implementation history'
    date: '2014-04-09'
    kind: official
    quote: Accordingly, the Plan was not implemented across all NMS Stocks until December 8, 2013.\26\ Subsequently, the Sixth
      Amendment to the Plan \27\ was filed on an immediately effective basis to extend the implementation date for full implementation
      of the Plan to February 24, 2014. Prior to February 24, 2014, the Plan was only in effect from 9:30 a.m. E.T. to 3:45
      p.m. E.T., and did not include the fifteen minutes of trading preceding the close.

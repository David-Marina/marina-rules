    not modelled. A broker pass-through is not a separately mandated customer charge. Zero is expressly sourced for transactions
    from 2026-10-01 through 2026-12-31, the temporary fee holiday set by the filing, so the record ends on 2027-01-01. The
    resumption of the normal rates for January 2027 transactions stated in the filing is not encoded beyond the waiver period.

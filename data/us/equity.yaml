  - url: https://www.govinfo.gov/content/pkg/FR-2026-09-23/html/2026-19392.htm
    publisher: SEC (Federal Register / GPO)
    title: TAF temporary fee holiday, SR-FINRA-2026-021
    date: '2026-09-23'
    kind: official
    quote: Specifically, FINRA is proposing to temporarily pause TAF revenue collection for transactions from October 1, 2026
      through December 31, 2026. For transactions during the three-month period of October, November, and December 2026, the
      TAF rates set forth in Section 1 of Schedule A to the FINRA By-Laws would temporarily be set at $0.00 and monthly invoices
      would reflect a $0.00 TAF assessment.
    content_sha256: 42851592b234d1b44d6e4d05cca45f7aaef132299bdb03709cc8d4e2ab88afbc
    hash_kind: text
  notes: Member-level FINRA Trading Activity Fee for covered equity sales, including listed ETFs; the cap applies per trade.
    Exemptions in Schedule A Section 1(b)(2), creation/redemption treatment, and the execution-price-below-fee exemption are
    not modelled. A broker pass-through is not a separately mandated customer charge. Zero is expressly sourced for transactions
    from 2026-10-01 through 2026-12-31, the temporary fee holiday set by the filing, so the record ends on 2027-01-01. The
    resumption of the normal rates for January 2027 transactions stated in the filing is not encoded beyond the waiver period.
  unit: USD

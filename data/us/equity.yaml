  - url: https://www.govinfo.gov/content/pkg/FR-2012-06-06/html/2012-13653.htm
    publisher: SEC (Federal Register / GPO)
    title: LULD Plan approval and operative Plan text
    date: '2012-06-06'
    kind: official
    quote: (2) The Percentage Parameters for Tier 1 NMS Stocks with a Reference Price more than $3.00 shall be 5%. (3) The
      Percentage Parameters for Tier 1 NMS Stocks with a Reference Price equal to $0.75 and up to and including $3.00 shall
      be 20%. (4) The Percentage Parameters for Tier 1 NMS Stocks with a Reference Price less than $0.75 shall be the lesser
      of (a) $0.15 or (b) 75%. … (2) The Percentage Parameters for Tier 2 NMS Stocks with a Reference Price more than $3.00
      shall be 10%. (3) The Percentage Parameters for Tier 2 NMS Stocks with a Reference Price equal to $0.75 and up to and
      including $3.00 shall be 20%. (4) The Percentage Parameters for Tier 2 NMS Stocks with a Reference Price less than $0.75
      shall be the lesser of (a) $0.15 or (b) 75%. (5) Notwithstanding the foregoing, the Percentage Parameters for a Tier
      2 NMS Stock that is a leveraged ETP shall be the applicable Percentage Parameter set forth in clauses (2), (3), or (4)
      above, multiplied by the leverage ratio of such product. … Between 9:30 a.m. and 9:45 a.m. ET, and 3:35 p.m. and 4:00
      p.m. ET, or in the case of an early scheduled close, during the last 25 minutes of trading before the early scheduled
      close, the Price Bands shall be calculated by applying double the Percentage Parameters set forth in Appendix A.
    content_sha256: 2dfd7941758d49d49d43f04202c6f5005ec593ffba8232115be579f5d22bf90b
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2014-04-09/html/2014-07881.htm
    publisher: SEC (Federal Register / GPO)
    title: 'Seventh LULD Amendment approval: actual implementation history'
    date: '2014-04-09'
    kind: official
    quote: Accordingly, the Plan was not implemented across all NMS Stocks until December 8, 2013.\26\ Subsequently, the Sixth
      Amendment to the Plan \27\ was filed on an immediately effective basis to extend the implementation date for full implementation
      of the Plan to February 24, 2014. Prior to February 24, 2014, the Plan was only in effect from 9:30 a.m. E.T. to 3:45
      p.m. E.T., and did not include the fifteen minutes of trading preceding the close.
    content_sha256: 98db83a2e68059b55ea028803d7e6891f2f68f07e9627c7cc8ca920dc1c7ab7e
    hash_kind: text
  - url: https://www.nyse.com/api/notifications/public/summary/13094?systemId=1
    publisher: NYSE
    title: LULD Phase 2b Implementation Reminder
    date: '2014-02-24'
    kind: official
    quote: This is a reminder that effective today, February 24, 2014, the price bands of the Limit Up Limit Down Plan will
      extend to the close at 4 p.m. in all NYSE, NYSE MKT and NYSE Arca-listed securities, except rights and warrants.
    content_sha256: 86a55e333dcfc1ffa9cf19c8742190e5c9c7a3e546193f5681ff9f632eb19c45
    hash_kind: bytes
  - url: https://www.nyse.com/api/notifications/public/summary/110000218186?systemId=1
    publisher: NYSE
    title: Implementation of LULD Plan Amendment 18 (Elimination of Double-Wide Bands)
    date: '2020-02-10'
    kind: official
    quote: 'As previously announced , on Monday, February 24, 2020, the NYSE equity exchanges (NYSE, NYSE American, NYSE Arca,
      NYSE Chicago and NYSE National), in coordination with other equities markets, will implement Amendment 18 to the Limit
      Up Limit Down Plan. … Currently, the Price Bands are calculated by applying double the Percentage Parameters between
      9:30 a.m. and 9:45 a.m., and between 3:35 p.m. and 4:00 p.m. LULD Amendment 18 eliminates the doubling of percentage
      parameters: • between 9:30 - 9:45 a.m. • between 3:35 - 4:00 p.m. for Tier 2 NMS stocks with a reference price above
      $3.00. Tier 1 NMS stocks will continue to be subject to doubling of percentage parameters between 3:35 - 4:00 p.m.'
    content_sha256: 1562d479bface1976274c54a1b06608aaafa710dc12dc79f3f55dea91bb8818b
    hash_kind: bytes
  - url: https://www.govinfo.gov/content/pkg/FR-2012-06-06/html/2012-13653.htm
    publisher: SEC (Federal Register / GPO)
    title: LULD reference prices and trading pauses
    date: '2012-06-06'
    kind: official
    quote: Those price bands would be based on a Reference Price \26\ for each NMS Stock that equals the arithmetic mean price
      of Eligible Reported Transactions for the NMS Stock over the immediately preceding five-minute period. … The Reference
      Price used for determining which Percentage Parameter shall be applicable during a trading day shall be based on the
      closing price of the NMS Stock on the Primary Listing Exchange on the previous trading day, or if no closing price exists,
      the last sale on the Primary Listing Exchange reported by the Processor. … If the market did not exit a Limit State
      within 15 seconds, then the Primary Listing Exchange would declare a five-minute trading pause, which would be applicable
      to all markets trading the security.
    content_sha256: 2dfd7941758d49d49d43f04202c6f5005ec593ffba8232115be579f5d22bf90b
    hash_kind: text
  notes: All times Eastern, ordinary full trading days. Tier 1 comprises S&P 500 and Russell 1000 stocks and designated ETPs;
    Tier 2 comprises other eligible NMS stocks. The caller must supply the applicable tier and leveraged-ETP ratio; Marina
    stores no constituents and adds no scope context keys. Tier 2 leveraged ETP percentage parameters are multiplied by the
    leverage ratio. Appendix A selects the price bracket from the previous primary-market closing price (or the specified
    last sale fallback), rather than changing brackets intraday; the band calculation uses the rolling arithmetic mean of
    eligible trades over the preceding five minutes, subject to opening and reference-update rules. abs_cap means the lesser
    of the absolute amount and pct times the reference price; doubling applies to the whole band width, including the absolute
    cap. A Limit State persisting 15 seconds normally triggers a five-minute trading pause; reopening, straddle-state discretion,
    tick rounding, lower-band floor and exceptions are not encoded. This is an intraday band, not a daily limit against yesterday's
    close. The extension through 16:00 went live on 2014-02-24. The opening doubling and all applicable closing doubling remain
    until the technical implementation of Amendment 18 on 2020-02-24; the 2019 approval date is not a bandwidth cutover.
  unit: USD

  recorded_at: '2026-11-05'
  verification: single-source
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2025-07-08/html/2025-12618.htm
    publisher: FINRA (rule filing, Federal Register / GPO)
    title: CAT Fee 2025-2
    date: '2025-07-08'
    kind: official
    quote: The fee rate for CAT Fee 2025-2 would be $0.000009 per executed equivalent share. CAT Executing Brokers will receive
      their first monthly invoice for CAT Fee 2025-2 in August 2025 calculated based on their transactions as CAT Executing
      Brokers for the Buyer (``CEBB'') and/or CAT Executing Brokers for the Seller (``CEBS'') in July 2025.
    content_sha256: ce0a5f7c239fab67fd0862eae443b697bbbb0d18d0f8336aabf74b6b480ddfc2
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2024-09-05/html/2024-19951.htm
    publisher: FINRA (rule filing, Federal Register / GPO)
    title: 'SR-FINRA-2024-011: CAT Fee 2024-1 and liable brokers'
    date: '2024-09-05'
    kind: official
    quote: CAT Fee 2024-1 will be charged to each CEBB and CEBS for each applicable transaction in Eligible Securities. …
      (a) with respect to a transaction in an Eligible Security that is executed on an exchange, the Industry Member identified
      as the Industry Member responsible for the order on the buy-side of the transaction and the Industry Member responsible
      for the sell-side of the transaction in the equity order trade event and option trade event in the CAT Data submitted
      to the CAT by the relevant exchange pursuant to the Participant Technical Specifications; and (b) with respect to a
      transaction in an Eligible Security that is executed otherwise than on an exchange and required to be reported to an
      equity trade reporting facility of a registered national securities association, the Industry Member identified as the
      executing broker and the Industry Member identified as the contra-side executing broker in the TRF/ORF/ADF transaction
      data event in the CAT Data submitted to the CAT by FINRA pursuant to the Participant Technical Specifications; provided,
      however, in those circumstances where there is a non-Industry Member identified as the contra-side executing broker
      in the TRF/ORF/ADF transaction data event or no contra-side executing broker is identified in the TRF/ORF/ADF transaction
      data event, then the Industry Member identified as the executing broker in the TRF/ORF/ADF transaction data event would
      be treated as CAT Executing Broker for the Buyer and for the Seller. … CEBBs and CEBSs may, but are not required to,
      pass-through their CAT Fees to their clients, who may, in turn, pass their fees to their clients until they are imposed
      ultimately on the account that executed the transaction.
    content_sha256: 4539ec9225ff312cfe3b829e4eba3ae6bce86dbcdcf21eb1845fc4862011b70b
    hash_kind: text
  - url: https://web.archive.org/web/20251201142309id_/https://www.catnmsplan.com/sites/default/files/2025-11/11.25.25-CAT-Fee-Alert-2025-4.pdf
    publisher: CAT LLC (CAT Fee Alert, web.archive.org copy)
    title: 'CAT Fee Alert 2025-4: cessation of both fees'
    date: '2025-11-25'
    kind: official
    quote: This CAT Fee Alert provides notice to Industry Members that the last invoice for CAT Fee 2025-2 (which has a fee
      rate of $0.000009 per executed equivalent share) will be provided in December 2025, based on November 2025 transactions.
      After the December 2025 invoice, CAT Reporters will not receive any further monthly invoices for CAT Fees until further
      notice. … This CAT Fee Alert also provides notice to Industry Members that the last invoice for Historical CAT Assessment
      1 (which has a fee rate of $0.000013 per executed equivalent share) will be provided in December 2025, based on November
      2025 transactions. After the December 2025 invoice, CAT Reporters will not receive any further monthly invoices for
      Historical CAT Assessments until further notice.
    content_sha256: 8747146ab724ade9fbc7d04489dad3004252c17e5199e5ff668df8de9343bee6
    hash_kind: bytes
  - url: https://web.archive.org/web/20250708050950id_/https://catnmsplan.com/sites/default/files/2025-05/05.29.25-CAT-Fee-Alert-2025-2.pdf
    publisher: CAT LLC (CAT Fee Alert, web.archive.org copy)
    title: 'CAT Fee Alert: CAT Fee 2025-2'
    date: '2025-05-29'
    kind: official
    quote: CAT Executing Broker will receive its first invoice for CAT Fee 2025-2 in August 2025, which will set forth the
      fees calculated based on transactions in July 2025, and will receive an invoice for CAT Fee 202 5-2 for each month thereafter
      until January 2026. … The fee for each such transaction will be calculated by multiplying the number of executed equi
      valent shares in the transaction by the fee rate of $0.000009 per executed equivalent share.
    content_sha256: b7915007cf34c79516bdf236e2d57f2b050458272d782f6b49ea9d1bd917319b
    hash_kind: bytes
  - url: https://web.archive.org/web/20250912232941id_/https://catnmsplan.com/sites/default/files/2025-08/08.14.25-CAT-Fee-Alert-2025-3.pdf
    publisher: CAT LLC (CAT Fee Alert, web.archive.org copy)
    title: 'CAT Fee Alert 2025-3: implemented replacement'
    date: '2025-08-14'
    kind: official
    quote: 'CAT Fee 2025-2 is now in effect. Accordingly, the last invoice for CAT Fee 2025-1 will be provided in July 2025,
      based on June 2025 transactions. Beginning in August 2025, CAT Reporters will receive monthly invoices for CAT Fee 2025-2
      based on transactions taking place during the previous month. … Beginning in August 2025, invoices will include: • CAT
      Fee 2025-2 (which has a fee rate of $0.000009 per executed equivalent share); and • Historical CAT Assessment 1 (which
      has a fee rate of $0.000013 per executed equivalent share).'
    content_sha256: d66ef886a4bb4979cf149de212772fc60a1e92afa525c28b1d737aaaff851903
    hash_kind: bytes
  notes: USD per executed equivalent share, per CAT Executing Broker role (buyer CEBB and seller CEBS); one NMS share is one
    executed equivalent share. This is a CAT LLC Industry Member fee, not a legally mandated customer charge; brokers may
    pass it through. The liable broker is identified in exchange CAT order-trade data or FINRA TRF/ORF/ADF executing/contra-side
    data, not automatically the clearing broker. If an off-exchange report identifies no Industry Member contra-side, the
    executing broker bears both roles. Values exclude Participant cost-recovery fees, exchange-specific pass-throughs, brokerage
    markups and customer rounding. Both CAT Fee and Historical CAT Assessment may run concurrently and are separate rules.
    Dates refer to charged transaction months, not invoice issue or payment due dates. No fees are imputed before the first
    actually billed transaction month. The pre-effective publication date is the CAT LLC fee alert date; the announcement
    was followed by the cited fee filing. Archive reliance keeps this record single-source.
  unit: USD

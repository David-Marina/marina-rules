- id: us.mwcb_decline_levels.us_stock.2010-01-01
  scope: us_stock
  rule: mwcb_decline_levels
  value:
    reference: djia_quarterly_points
    levels:
    - 0.1
    - 0.2
    - 0.3
  effective_from: '2010-01-01'
  effective_to: '2013-04-08'
  published_at: null
  recorded_at: '2026-11-04'
  verification: single-source
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2012-06-06/html/2012-13652.htm
    publisher: SEC / participating SROs (Federal Register / GPO)
    title: Order approving revised market-wide circuit breakers
    date: '2012-06-06'
    kind: official
    quote: The values of Levels 1, 2, and 3 are calculated at the beginning of each calendar quarter, using 10%, 20%, and
      30%, respectively, of the average closing value of the Dow Jones Industrial Average (``DJIA'') for the month prior to
      the beginning of the quarter. … Each percentage calculation is rounded to the nearest 50 points and remains in effect
      until the next quarterly calculation. Level 1 Halt Before 2:00 p.m.--one hour; At or after 2:00 p.m. but before 2:30
      p.m.--30 minutes; At or after 2:30 p.m.--trading shall continue, unless there is a Level 2 Halt. Level 2 Halt Before
      1:00 p.m.--two hours; At or after 1:00 p.m. but before 2:00 p.m.--one hour; At or after 2:00 p.m.--trading shall halt
      and not resume for the rest of the day.
    content_sha256: a89dc5f109b763eb1c039148731fd1b449d80aa82bc699825344f32af21660e2
    hash_kind: text
  - url: https://www.nasdaqtrader.com/trader.aspx?id=CircuitBreaker
    publisher: Nasdaq
    title: Market Wide Circuit Breakers
    date: null
    kind: official
    quote: Reduce the market decline percentage thresholds needed to trigger a circuit breaker to 7%, 13% and 20% from the
      prior day's closing price, rather than declines of 10, 20 or 30 percent. Simplify the market circuit breaker rules by
      reducing the number of relevant trigger time periods and trading halt durations. Use the broader S&P 500 Index (rather
      than the Dow Jones Industrial Average) as the pricing reference to measure a market decline and require that the trigger
      thresholds be recalculated daily (rather than quarterly). The revised Market Wide Circuit Breaker rule 2013 was implemented
      Monday, April 8, 2013.
    content_sha256: 92932818c1f726ab03b9de4deed23521b0d9969c3232e9e56f8b8ce492b5291e
    hash_kind: text
  notes: 'Coverage starts at 2010-01-01 because the original operative date of the old regime was not located. Thresholds
    were fixed for each quarter using the average DJIA closing value of the preceding month, rounded to the nearest 50 points.
    All times Eastern. Level 1: before 14:00, one hour; 14:00 to before 14:30, 30 minutes; at or after 14:30, no Level 1 halt.
    Level 2: before 13:00, two hours; 13:00 to before 14:00, one hour; at or after 14:00, remainder of day. Level 3: remainder
    of day at any time. The 2012 order describes the existing regime; it is not treated as the implementation date.'

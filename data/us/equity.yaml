- id: us.short_sale_price_test.us_stock.2007-07-06
  scope: us_stock
  rule: short_sale_price_test
  value: none
  effective_from: '2007-07-06'
  effective_to: '2011-02-28'
  published_at: '2007-07-03'
  recorded_at: '2026-11-05'
  verification: single-source
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2007-07-03/html/E7-12868.htm
    publisher: SEC (Federal Register / GPO)
    title: Regulation SHO and Rule 10a-1; final rule
    date: '2007-07-03'
    kind: official
    quote: 'Effective Date: July 3, 2007. Compliance Date: July 6, 2007. … No short sale price test, including any short sale
      price test of any self-regulatory organization, shall apply to short sales in any security.'
    content_sha256: bd1a76563322ffffa5bfbdcd5bbaae9d4e3eff9e34473a8b8545fb7f9a8709f6
    hash_kind: text
  - url: https://www.nyse.com/publicdocs/nyse/notifications/trader-update/Tick_Test.pdf
    publisher: NYSE Arca
    title: SEC Eliminates Tick Test Rule from Reg SHO
    date: '2007-06-29'
    kind: official
    quote: Effective Friday, July 6, 2007 the Securities and Exchange Commission (SEC) will eliminate the “tick test” from
      Regulation SHO. … NYSE Arca will eliminate all system validations for short sales on July 6, 2007. An order marked as
      short will be processed identically to sell orders marked as long.
    content_sha256: 1a1d434b777c03f6eafbe539d901f6dae2b13ccfdc226f56d1db99401f8e8727
    hash_kind: bytes
  notes: No price test is explicit in former Rule 201(a); Rule 10a-1 was removed. July 3, 2007 is legal effectiveness; July
    6 is the actual compliance date used here. This means no short-sale price test, not exemption from locate, delivery, marking
    or other short-sale obligations. NYSE Arca independently confirms its system change, but does not establish full XNYS/XNAS
    scope on its own; conservatively single-source.
- id: us.short_sale_price_test.us_stock.2011-02-28
  scope: us_stock
  rule: short_sale_price_test
  value:
    trigger_decline_pct: 0.1
    reference: prior_close
    restriction: above_national_best_bid
    duration: rest_of_day_and_next_day
  effective_from: '2011-02-28'
  effective_to: null
  published_at: '2010-11-09'
  recorded_at: '2026-11-05'
  verification: verified
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2010-03-10/html/2010-4409.htm
    publisher: SEC (Federal Register / GPO)
    title: Amendments to Regulation SHO; final rule
    date: '2010-03-10'
    kind: official
    quote: 'Effective Date: May 10, 2010. Compliance Date: November 10, 2010. … (b)(1) A trading center shall establish, maintain,
      and enforce written policies and procedures reasonably designed to: (i) Prevent the execution or display of a short
      sale order of a covered security at a price that is less than or equal to the current national best bid if the price
      of that covered security decreases by 10% or more from the covered security''s closing price as determined by the listing
      market for the covered security as of the end of regular trading hours on the prior day; and (ii) Impose the requirements
      of paragraph (b)(1)(i) of this section for the remainder of the day and the following day when a national best bid for
      the covered security is calculated and disseminated on a current and continuing basis by a plan processor pursuant to
      an effective national market system plan. (iii) Provided, however, that the policies and procedures must be reasonably
      designed to permit: (A) The execution of a displayed short sale order of a covered security by a trading center if,
      at the time of initial display of the short sale order, the order was at a price above the current national best bid;
      and (B) The execution or display of a short sale order of a covered security marked ``short exempt'''' without regard
      to whether the order is at a price that is [[Page 11324]] less than or equal to the current national best bid. … We
      have determined to adopt without modification in Rule 201(d)(6) a provision that will permit a broker-dealer to mark
      as ``short exempt'''' short sale orders where broker-dealers are facilitating customer buy orders or sell orders where
      the customer is net long, and the broker-dealer is net short but is effecting the sale as riskless principal.\510\'
    content_sha256: ad43fce39cdcc0f6c27dbf16f19899eb911e2c82149b3082b29a4771fb5d4471
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2010-11-09/html/2010-28327.htm
    publisher: SEC (Federal Register / GPO)
    title: Regulation SHO; extension of compliance date
    date: '2010-11-09'
    kind: official
    quote: The compliance date for both Rules has been extended from November 10, 2010 to February 28, 2011. … Rule 201 requires
      that a trading center establish, maintain, and enforce written policies and procedures reasonably designed to prevent
      the execution or display of a short sale order of a covered security at a price that is less than or equal to the current
      national best bid if the price of that covered security decreases by 10% or more from its closing price as determined
      by the listing market for the covered security as of the end of regular trading hours on the prior day.\2\
    content_sha256: 66930c245d27455805a28fe93dcffecc1cd634fa32f1c1b15254bc0204730909
    hash_kind: text
  - url: https://www.finra.org/rules-guidance/notices/10-48
    publisher: FINRA
    title: Regulatory Notice 10-48, updated compliance date
    date: '2010-10-12'
    kind: official
    quote: 'The effective date was extended to February 28, 2011. … On February 26, 2010, the SEC adopted amendments to Regulation
      SHO that, among other things, implement a short-sale circuit breaker for NMS stocks 4 triggered by a 10 percent or more
      decrease in the price of the security from the security''s closing price at the end of regular trading hours on the
      prior trading day. Once a circuit breaker is triggered, Regulation SHO, as amended, generally requires trading centers
      to establish, maintain and enforce written policies and procedures reasonably designed to prevent the execution or display
      of short sale orders of an NMS stock at a price that is less than or equal to the current national best bid (NBB) for
      the remainder of the day and the following day, unless an exemption applies ("short sale price test restriction"). 5
      … As amended, Regulation SHO provides several exemptions to the short sale price test restriction and sets forth provisions
      under which a short sale order may be marked "short exempt." These provisions include: • broker-dealer policies and
      procedures; • seller''s delay in delivery; • odd lot transactions; • domestic arbitrage; • international arbitrage;
      • over-allotments and lay-off sales; • riskless principal transactions; and • transactions on a volume-weighted average
      price basis (or VWAP). 6 Consistent with these amendments to Regulation SHO,'

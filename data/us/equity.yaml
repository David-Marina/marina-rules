# US equities (NYSE and Nasdaq, MICs XNYS and XNAS): exchange-listed NMS common stocks (us_stock) and ETFs (us_etf),
# ordinary secondary-market transactions. Rules: Section 31 transaction fee on sales, FINRA Trading Activity Fee on
# sales, regular-way settlement cycle, same-day resale, the Regulation NMS Rule 612 minimum quotation increment,
# Limit Up-Limit Down bands, market-wide circuit-breaker levels, the 2010-2013 single-stock trading-pause pilot, the
# CAT LLC fee and historical assessment per executed equivalent share, the Regulation SHO short-sale price test (none
# from 2007-07-06; the Rule 201 circuit breaker from 2011-02-28) and the account-level pattern-day-trader minimum equity
# for margin accounts (from 2001-09-28 to 2026-06-04; known gaps after) (market XNYS+XNAS: federal / national-plan /
# FINRA rules), and per-exchange trading sessions and extended hours (market XNYS or XNAS = the security's primary
# listing exchange; trading of the same security elsewhere under unlisted trading privileges is not modelled).
# Coverage starts 2010-01-01. Sources: SEC orders and final rules (Federal Register / GPO), FINRA notices and rule
# filings, the official revision history of FINRA By-Laws Schedule A and Rule 4210, NYSE, NYSE Arca and Nasdaq notices,
# rule filings and trading pages, and CAT LLC fee alerts (archived copies).
schema: 1.1
market: XNYS+XNAS
asset_class: equity
records:
- id: us.sec_fee_rate_sell.us_stock.2010-01-01
  scope: us_stock
  rule: sec_fee_rate_sell
  value: 2.57e-05
  effective_from: '2010-01-01'
  effective_to: '2010-01-15'
  published_at: '2009-03-05'
  recorded_at: '2026-11-04'
  verification: single-source
  sources:
  - url: https://www.govinfo.gov/content/pkg/FR-2009-03-05/html/E9-4738.htm
    publisher: SEC (Federal Register / GPO)
    title: 2009 mid-year Section 31 adjustment
    date: '2009-03-05'
    kind: official
    quote: It is hereby ordered that each of the fee rates under Sections 31(b) and (c) of the Exchange Act shall be $25.70
      per $1,000,000 of the aggregate dollar amount of sales of securities subject to these sections, effective on the later
      of (i) April 1, 2009, or (ii) 30 days after the date on which a regular appropriation to the Commission for fiscal year
      2009 is enacted.
    content_sha256: 34dec3ab7bd36e93d28ee915228ce854908f56fcd6afd9210b4abd4a5096b78e
    hash_kind: text
  - url: https://www.finra.org/rules-guidance/notices/information-notice-122409
    publisher: FINRA
    title: FINRA Information Notice 12/24/09
    date: '2009-12-24'
    kind: official
    quote: Effective January 15, 2010, the Section 31 fee will decrease the rate applicable to specified securities transactions
      on the exchanges and in the over-the-counter markets from$25.70 per million dollars to $12.70 per million dollars.
    content_sha256: edd66875f9ab719dbc5fe4dc463cad73d7a127c72fd5f9a5989488619bfb6415
    hash_kind: text
  notes: Fraction of covered sell turnover under Exchange Act Section 31(b)/(c), not a registration fee. Exchanges and FINRA
    owe the SEC; brokers commonly pass the charge to sellers. Ordinary non-exempt secondary-market sales; broker rounding
    and additional commissions are not modelled. Dates follow the statutory order, including non-trading dates. Start clipped
    to 2010-01-01; the exact original 2009 implementation day was not established from the retrieved order, which made it
    conditional on appropriations.

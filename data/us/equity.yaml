  notes: The 10 percent decline includes equality. Prior close is the covered security's closing price determined by its primary
    listing market at the end of regular trading hours on the prior trading day. Trading centers must maintain policies and
    procedures reasonably designed to prevent execution or display at or below the current national best bid after triggering.
    The restriction lasts for the rest of the trigger day and the following trading day while a national best bid is calculated
    and disseminated; a further qualifying decline can retrigger it. Rule 201(c)-(d) permits qualifying short-exempt orders,
    including the above-NBB broker-dealer provision, delayed delivery, odd lots, domestic/international arbitrage, over-allotments/lay-off
    sales, qualifying riskless principal and VWAP transactions; conditions and documentation apply, and there is no blanket
    bona fide market-making exemption. The original final rule gives May 10, 2010 as legal effectiveness and November 10,
    2010 as original compliance; the extension establishes February 28, 2011 as actual compliance. Its DATES sentence inconsistently
    says March 10 for effectiveness; that is the original publication date, not the implementation date used here. 2018 and

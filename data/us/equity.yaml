- id: us.pattern_day_trader_min_equity.us_stock.2001-09-28
  scope: us_stock
  rule: pattern_day_trader_min_equity
  value:
    min_equity: 25000.0
    day_trades: 4
    window_business_days: 5
  effective_from: '2001-09-28'
  effective_to: '2026-06-04'
  published_at: '2001-03-27'
  recorded_at: '2026-11-05'
  verification: single-source
  sources:
  - url: https://www.finra.org/rules-guidance/notices/01-26
    publisher: FINRA (NASD Notice to Members)
    title: Notice to Members 01-26
    date: '2001-03-27'
    kind: official
    quote: The amendments become effective on September 28, 2001 and are substantially similar to amendments by the New York
      Stock Exchange (NYSE) to its margin rules. … (1) Definition of "pattern day trader." Under the amendments, "pattern
      day traders" are defined as those customers who day trade four or more times in five business days. If day-trading activities
      do not exceed six percent of the customer's total trading activity for the five-day period, the clearing firm is not
      required to designate such accounts as pattern day traders. The six percent threshold is designed to allow clearing
      firms to exclude from the definition of pattern day trader those customers whose day-trading activities comprise a small
      percentage of their overall trading activities. In addition, if the firm knows or has a reasonable basis to believe
      that the customer is a pattern day trader (for example, if the firm provided training to the customer on day trading
      in anticipation of the customer opening an account), the customer must be designated as a pattern day trader immediately,
      instead of delaying such determination for five business days. (2) Minimum equity requirement. The amendments require
      that a pattern day trader have deposited in his or her account minimum equity of $25,000 on any day in which the customer
      day trades. The required minimum equity must be in the account prior to any daytrading activities; however, firms are
      not required under the rule to monitor the minimum equity requirements on an intra-day basis. The minimum equity requirement
      addresses the additional risks inherent in leveraged day trading activities and ensures that customers cover losses
      incurred in their accounts from the previous day before continuing to day trade. (3) Day-trading buying power. The amendments
      limit daytrading buying power to four times the day trader's maintenance margin excess. This calculation is based on
      the customer's account position as of the close of business of the previous day.
    content_sha256: d3bb084753edfa62d6cb4c545c5ab8335cb466933839e945763b76c07496c688
    hash_kind: text
  - url: https://www.finra.org/rev/1982276
    publisher: FINRA
    title: Rule 4210 revision applicable May 22, 2024 through June 3, 2026
    date: null
    kind: official
    quote: (ii) The term "pattern day trader" means any customer who executes four or more day trades within five business
      days. However, if the number of day trades is 6 percent or less of total trades for the five business day period, the
      customer will not be considered a pattern day trader and the special requirements under paragraph (f)(8)(B)(iv) of this
      Rule will not apply. In the event that the member at which a customer seeks to open an account or to resume day trading
      knows or has a reasonable basis to believe that the customer will engage in pattern day trading, then the special requirements
      under paragraph (f)(8)(B)(iv) of this Rule will apply. … (iii) The term "day-trading buying power" means the equity
      in a customer's account at the close of business of the previous day, less any maintenance margin requirement as prescribed
      in paragraph (c) of this Rule, multiplied by four for equity securities. The day-trading buying power for non-equity
      securities may be computed using the applicable special maintenance margin requirements pursuant to other provisions
      of this Rule. … a. Minimum Equity Requirement for Pattern Day Traders — The minimum equity required for the accounts
      of customers deemed to be pattern day traders shall be $25,000. This minimum equity must be deposited in the account
      before such customer may continue day trading and must be maintained in the customer's account at all times.
    content_sha256: c16fc46408930604d30384bf0f5add4320e65c0825fed21d33aa24881cd5fa01
    hash_kind: bytes
  - url: https://www.finra.org/rules-guidance/notices/10-45
    publisher: FINRA
    title: Regulatory Notice 10-45
    date: '2010-10-04'
    kind: official
    quote: FINRA's rule change 1 to adopt consolidated rules regarding margin requirements, daily record of required margin
      and extension of time requests under Regulation T and SEA Rule 15c3-3 for the Consolidated FINRA Rulebook 2 becomes
      effective December 2, 2010. The new FINRA rules are based on and replace provisions in the NASD and Incorporated NYSE
      Rules. 3
    content_sha256: 16bc0035de830b288fa8e4f6cf8fb1e47a7162c6c579a1854f1dc8f618bf0566
    hash_kind: text
  - url: https://www.govinfo.gov/content/pkg/FR-2001-03-06/html/01-5402.htm
    publisher: NASD / NYSE (SEC approval of SRO filings; Federal Register / GPO)
    title: SEC approval of day-trading margin rule changes
    date: '2001-03-06'
    kind: official
    quote: February 27, 2001. … This order approves the NYSE and NASD rule change proposals, as amended. … Under the NASD
      proposal, a Pattern Day Trader, in order to meet the Day Trading Minimum Equity Requirement, would be required to maintain
      $25,000 in his or her account on any day in which he or she day trades.
    content_sha256: 40ab42a7ff5047aa4f49cfbcc6bcf518bcf5be03fa6e331f3dc3252519fa301f
    hash_kind: text
  notes: 'Account-level requirement for customer margin accounts, not a per-security holding restriction. Cash accounts are
    not subject to PDT designation and instead remain subject to payment and settled-funds constraints. Four or more day trades
    within five business days qualify unless day trades are 6 percent or less of total trades; reasonable knowledge of intended
    pattern day trading can also trigger designation. Day-trading buying power for equity securities is generally four times
    the prior-close maintenance margin excess (equity minus maintenance margin), with stricter consequences for calls and
    non-margin-eligible securities. September 28, 2001 is the NASD predecessor implementation date stated in Notice 01-26;
    Rule 4210 consolidated NASD Rule 2520 and Incorporated NYSE Rule 431 from December 2, 2010 without changing these encoded
    values. SEC approval of an SRO filing and the FINRA notice count as one publisher under this project policy. The record
    ends on June 4, 2026, the effective date of FINRA''s amendments that replace the pattern day trader designation and the
    $25,000 minimum with account-level intraday margin standards. Members may phase in the new standards until October 20,
    2027, so from June 4, 2026 which requirement applies depends on the broker: known gaps G-US-0014 (us_stock) / G-US-0015
    (us_etf), no record.'
  unit: USD

    publisher: Nasdaq
    title: 'Equity Trader Alert 2013-27: LULD and MWCB rollout'
    date: '2013-03-27'
    kind: official
    quote: In addition, on April 8, 2013 the revised Market Wide Circuit Breakers will go into effect.
    content_sha256: b86f280b1296cbe482f2798602c779ea4234e529b223e5fbe4db4f8137a0a69a
    hash_kind: text
  - url: https://www.nyse.com/publicdocs/nyse/NYSE_MWCB_FAQ.pdf
    publisher: NYSE
    title: Market-Wide Circuit Breakers FAQ, version 4.0 (February 2026)
    date: null
    kind: official
    quote: A MWCB can be triggered at three circuit breaker thresholds measured by a decrease against the prior day’s Closing
      Price of the S&P 500 Index -- 7% (Level 1), 13% (Level 2), and 20% (Level 3). Rule 7.12 governs MWCB. 2. When can a
      MWCB be triggered? Level 1 and Level 2 can be triggered between 9:30 a.m. and 3:25 p.m.1 Level 3 can be triggered at
      any time. 3. If a MWCB is triggered, how long do the markets halt? Level 1 and Level 2 breaches halt trading for a minimum
      of 15 minutes. Level 3 breach halts trading for the remainder of the trading day.
    content_sha256: e5fce6a796c0218a3a63e191648a46a07c37ef66fbf65b96d4cbdc21e726f2c8
    hash_kind: bytes
  - url: https://www.nyse.com/api/notifications/public/summary/12065?systemId=1
    publisher: NYSE
    title: NYSE and NYSE MKT LULD/MWCB Activation Plans
    date: '2013-04-03'
    kind: official
    quote: On Monday, April 8, 2013, NYSE and NYSE MKT will activate new Market Wide Circuit Breaker (MWCB) rules for all
      stocks and begin Limit Up / Limit Down (LULD) activation of Tier 1 stocks.
    content_sha256: cfac6b32ea97f719311d313a2fa74c76b9ea06d6f66672d70000cb8727da68a1
    hash_kind: bytes
  notes: 'Thresholds are recalculated daily against the previous trading day S&P 500 closing value. All times Eastern on ordinary
    full trading days: Level 1 and Level 2 halt trading for at least 15 minutes only before 15:25; at or after 15:25 trading
    continues unless Level 3 is reached. Each of Levels 1 and 2 can trigger only once per day. Level 3 ends trading for the
    remainder of the day at any time. Early closes and reopening auction mechanics are not encoded. Nasdaq and NYSE each independently
    confirm the implementation date; their circuit-breaker guidance confirms the parameters.'

- id: us.min_holding_days.us_stock.2010-01-01
  scope: us_stock
  rule: min_holding_days
  value: 0
  effective_from: '2010-01-01'
  effective_to: null
  published_at: null
  recorded_at: '2026-11-04'
  verification: single-source
  sources:
  - url: https://www.finra.org/rev/347644
    publisher: FINRA
    title: FINRA Rule 4210 historical day-trading definition
    date: null
    kind: official
    quote: 'The term "day trading" means the purchasing and selling or the selling and purchasing of the same security on
      the same day in a margin account except for: a.'
    content_sha256: df4bc366bd79b3c618c2a5ca983137b422f515961207f258718abe372a42fe82
    hash_kind: bytes
  - url: https://www.finra.org/investors/insights/frequent-intraday-trading
    publisher: FINRA
    title: 'Frequent Intraday Trading: Understanding the Basics'
    date: '2026-06-04'
    kind: official
    quote: if you want to engage in intraday trading in a cash account, be sure that you fully pay for those securities at
      the time of purchase with settled funds.
    content_sha256: 8383b18a502ce18f90f1414ff6c38858c13294c4dcb36997a6bb4af6c99d86b6
    hash_kind: text
  notes: Inference from express recognition of same-day purchases and sales, not an unconditional entitlement to unlimited
    trading. Start clipped to 2010-01-01 because the original inception was not established. Pattern Day Trader requirements
    under historical FINRA Rule 4210 govern margin accounts and do not change this holding-period value; cash-account payment
    and settled-funds constraints remain. FINRA amended its intraday-margin framework in 2026, which also does not create
    a security-level holding period.

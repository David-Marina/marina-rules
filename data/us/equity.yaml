      stocks and begin Limit Up / Limit Down (LULD) activation of Tier 1 stocks.
    content_sha256: cfac6b32ea97f719311d313a2fa74c76b9ea06d6f66672d70000cb8727da68a1
    hash_kind: bytes
  notes: 'Thresholds are recalculated daily against the previous trading day S&P 500 closing value. All times Eastern on ordinary
    full trading days: Level 1 and Level 2 halt trading for at least 15 minutes only before 15:25; at or after 15:25 trading
    continues unless Level 3 is reached. Each of Levels 1 and 2 can trigger only once per day. Level 3 ends trading for the
    remainder of the day at any time. Early closes and reopening auction mechanics are not encoded. Nasdaq and NYSE each independently
    confirm the implementation date; their circuit-breaker guidance confirms the parameters.'

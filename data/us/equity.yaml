  - url: https://www.nyse.com/api/notifications/public/summary/8446?systemId=1
    publisher: NYSE
    title: New Reg SHO Implementation Date
    date: '2010-11-05'
    kind: official
    quote: On November 4, 2010, the Securities and Exchange Commission extended the Reg SHO (Rule 201) compliance date from

    at https://www.nasdaqtrader.com/trader.aspx?id=CircuitBreaker; neither explicitly states that daily percentage price limits
    are absent.
  - Reviewed the SEC LULD approval at https://www.govinfo.gov/content/pkg/FR-2012-06-06/html/2012-13653.htm and searched the
    Federal Register official API for the exact phrases no daily price and NYSE no daily; no qualifying statement was found.

- gap_id: G-US-0008
  market: XNYS
  scope: us_stock
  rule: extended_hours
  interval:
    from: '2010-01-01'
    to: null
  severity: medium
  reason: 'Not found: a complete dated applicability chain establishing the absence of both continuous extended sessions for
    NYSE-primary securities throughout the requested interval. The 2019 Pillar filing explicitly says Exchange-listed securities
    trade only in the Core Trading Session and preserves existing Rule 51 treatment; the 2018 filing says there is no Late
    Trading Session. These clarify the session distinction but do not establish the full earlier chronology or an actual 2010
    applicability date. Crossing Session II accepted aggregate-price coupled orders, not continuous trading, and was decommissioned
    on January 31, 2024. The 2007 Gold Shares early-opening approval also cautions against assuming one historical ETF schedule;
    its implementation and listing migration were not established here. Therefore neither continuous windows nor null are
    backfilled. On the current hours page NYSE-listed securities have pre-opening order entry only (from 06:30, queued for
    the 09:30 opening auction); the 07:00-09:30 early trading session introduced with the April 2018 Tape B and C expansion
    is limited to non-primary securities.'
  evidence:
  - https://www.nyse.com/publicdocs/nyse/markets/nyse/Pillar_Update_NYSE_American_ARCA_NYSE_Tapes_B_and_C.pdf
  - https://www.nyse.com/publicdocs/nyse/markets/nyse/Pillar_Update_NYSE_Tapes_B_and_C_symbol_migration_Approved.pdf
  - https://www.nyse.com/api/notifications/public/summary/110000087399?systemId=1

- gap_id: G-US-0014
  market: XNYS+XNAS
  scope: us_stock
  rule: pattern_day_trader_min_equity
  interval:
    from: '2026-06-04'
    to: null
  severity: medium
  reason: 'FINRA''s amendments to Rule 4210 took effect on June 4, 2026: they remove the pattern day trader day-trade-count
    definition and the special $25,000 pattern day trader minimum equity requirement and replace them with an account-level
    intraday margin deficit calculation. Members may, however, phase in implementation over 18 months, until October 20, 2027,
    and a member that has not yet implemented the new standards may still apply the former pattern day trader requirements.
    Within this scope the applicable regime therefore depends on the broker, and Marina holds no broker information, so no
    single value can be given (the same kind of mixed applicability as a rule phased in security by security). From October
    20, 2027 the special requirement is none at every member, but that is outside the coverage window and no record is created.'
  evidence:
  - 'https://www.finra.org/rules-guidance/notices/26-10 (Regulatory Notice 26-10, April 20, 2026) states: "The effective date
    of the amendments is June 4, 2026, 45 days from publication of this Notice . Members that need more time to implement
    the rule change will be permitted to phase in their implementation over a period of 18 months, until October 20, 2027."
    The new standards replace the day trading margin requirements in their entirety, including the day trade count for designating
    a pattern day trader and the $25,000 minimum equity requirement.'
  - https://www.govinfo.gov/content/pkg/FR-2026-04-17/html/2026-07485.htm (SEC approval of SR-FINRA-2025-017, April 14, 2026)
    approves the 18-month phased-in implementation, which lets broker-dealers implement the new intraday margin requirements
    any time after the 45-day effective date; during those 45 days all members must apply the current day trading rules.
  - 'https://www.finra.org/rev/2021726 (Rule 4210 as in effect from June 4, 2026): new paragraph (d)(2) requires each member
    to determine the intraday margin deficit of each customer margin account (other than a good faith or portfolio margin
    account) for each day with an IML-reducing transaction, and to have it satisfied as promptly as possible.'
  - 'https://www.finra.org/investors/insights/frequent-intraday-trading (FINRA investor insight, June 4, 2026): margin trading
    still requires minimum equity of $2,000 and firms may impose higher house requirements; intraday trading in a cash account
    must be paid for with settled funds.'
  status: open

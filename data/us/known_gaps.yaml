- gap_id: G-US-0010
  market: XNYS+XNAS
  scope: us_stock
  rule: single_stock_pause_pct
  interval:
    from: '2010-06-11'
    to: '2011-08-08'
  severity: medium
  reason: 'Group membership (index constituents, designated ETPs) is the caller''s to determine, as for luld_band and the
    Hong Kong vcm_trigger_pct, and is not itself a gap. The gap is that the pilot was activated security by security: NYSE
    activated five S&P 500 securities on June 11, 2010 and a total of 54 on June 14, 2010, and the date by which every NYSE-listed
    S&P 500 security was covered was not found; the September 2010 expansion began on September 14, 2010 with NYSE-listed
    Russell 1000 symbols, and the designated ETPs were added in batches (five issues on September 14 and 106 on September
    15, 2010, which the NYSE Arca trader update calls completing the first phase of rollout). Nasdaq implemented all its S&P
    500 issues on June 14, 2010 without phasing and its Russell 1000 and selected ETP expansion on September 14, 2010. No
    official text states a day from which every group was in force for all its securities, so no record is constructed before
    the all-NMS implementation on August 8, 2011. No gap is declared for this scope before its pilot participation began.
    Re-researched: NYSE''s S&P 500 activation rollout schedule (dates through June 16, 2010) is a plan, not a confirmation
    of completion; the Russell 1000 notice dates the start of the September 2010 expansion, not its completion; no XNYS completion
    notice for the S&P 500 stocks or any expansion group was found. Whatever such a date, other NMS stocks remained outside
    the pilot until August 8, 2011, so the interval and the absence of a record are unchanged.'
  evidence:
  - https://www.nyse.com/api/notifications/public/summary/8064?systemId=1
  - https://www.nyse.com/api/notifications/public/summary/8075?systemId=1
  - https://www.nyse.com/api/notifications/public/summary/8293?systemId=1
  - https://www.nyse.com/publicdocs/nyse/notifications/trader-update/ExpandedTradingPausePilot.pdf
  - https://www.govinfo.gov/content/pkg/FR-2011-08-17/html/2011-20902.htm
  - https://www.nasdaqtrader.com/content/productsservices/trading/tradingpausefaqs.pdf
  - 'https://www.nyse.com/api/notifications/public/summary/8063?systemId=1 states: "The NYSE Cash Market Volatility Trading
    Pause Activation Rollout Schedule for S&P 500 securities is now available via this link:" and "We will update the activation
    list and issue an NYSE Trade Update with any revisions to this schedule." This is a rollout schedule, not confirmation
    of actual completion.'
  - https://www.nyse.com/publicdocs/nyse/notifications/trader-update/s_p_vtp_schedule_.xls contains first-column Excel date
    cells through June 16, 2010. This is a scheduled endpoint only; an actual completion announcement was not found. The June
    12 notice at https://www.nyse.com/api/notifications/public/summary/8075?systemId=1 still says "the Activation Rollout
    Schedule for Monday, June 14, 2010 has been expanded to include a total of 54 securities."
  - 'https://www.nyse.com/api/notifications/public/summary/8293?systemId=1 states: "the NYSE will expand the list of stock
    symbols eligible for Volatility Trading Pauses - single-stock circuit breakers - to include NYSE-listed symbols in the
    Russell 1000 index beginning Tuesday, September 14." The linked list at https://www.nyse.com/publicdocs/nyse/notifications/trader-update/vtp_symbol_list.xlsx
    is an eligibility list, not a completion confirmation.'
  - 'Not found: actual completion for all XNYS S&P 500 stocks or all XNYS expansion groups. Searched the NYSE public notifications
    API for trading pause, Volatility, and S&P; reviewed notices 8063, 8064, 8075, 8293, the linked rollout schedule and eligible-symbol
    list, proposed Rule 80C FAQ, and Nasdaq trading-pause FAQ. Nasdaq''s own June 14 completion and NYSE Arca''s September
    15 first-phase ETP completion do not establish XNYS completion.'
  - https://www.nyse.com/api/notifications/public/summary/32414744?systemId=1 links to a Volatility Trading Pause Verification
    document, but identifies NYSE ARCA EQUITIES; the linked PDF returned 404. It cannot establish XNYS completion.
  status: open

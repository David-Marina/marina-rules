schema: 1.1
gaps:
- gap_id: G-HK-0001
  market: XHKG
  scope: hk_stock
  rule: session_schedule
  interval:
    from: '2016-07-25'
    to: '2019-10-08'
  severity: medium
  reason: The scope contains both CAS and non-CAS stocks in this interval. Phase 1 covered HSCI LargeCap and MidCap constituent
    stocks, H shares with corresponding Mainland-listed A shares, and all ETFs; phase 2 added HSCI SmallCap constituents,
    not all equities. Index-deletion treatment also changed. A single full-scope session schedule cannot encode this conditional
    CAS eligibility without new context.
  evidence:
  - The May 2016 implementation briefing at https://www.hkex.com.hk/-/media/Market-System/market/sec_tradinfra/vcm_cas/Documents/CAS-VCM-EP-Briefing-Session-May-(Eng).pdf
    specifies LargeCap/MidCap constituents, H shares with Mainland A shares, and all ETFs; https://www.hkex.com.hk/News/Market-Communications/2016/160720news?sc_lang=en
    confirms commencement on 25 July 2016. Phase 1 retained stocks deleted from the relevant indices.
  - HKEX announcements at https://www.hkex.com.hk/News/Market-Communications/2017/170717news?sc_lang=en and https://www.hkex.com.hk/News/Market-Communications/2017/170724news?sc_lang=en
    establish 24 July 2017 phase 2, addition of HSCI SmallCap constituents and regulated short selling. The 17 July announcement
    specifies removal of deleted index constituents from phase 2 onward, including removal on launch of previously retained
    deletions; A/H eligibility also ceases on delisting of the corresponding A share.
  - HKEX successful rollout announcement at https://www.hkex.com.hk/News/Market-Communications/2019/1910082news?sc_lang=en
    establishes that all equities and funds joined on 8 October 2019. The 2015 proposal at https://www.hkex.com.hk/News/Market-Communications/2015/150703news?sc_lang=en
    envisaged broader phase-2 coverage but was not the final 2017 implemented scope.
  status: open
- gap_id: G-HK-0002
  market: XHKG
  scope: hk_etf
  rule: stamp_duty_buy
  interval:
    from: '2010-01-01'
    to: '2015-02-13'
  severity: medium
  reason: No single rate can represent all ETFs before the universal waiver. The earlier regime combined taxed ETFs and ETF-specific
    remissions; the 2015 HKEX announcement reports a greater-than-40-percent Hong Kong equity composition exclusion. A composition-aware
    scope is needed. No uniform historical value was found.
  evidence:
  - IRD historical remission guidance at https://www.ird.gov.hk/eng/pdf/irsd128.pdf states that it applies only to transactions
    before 13 February 2015 and identifies Specified ETFs in Annex 1.
  - HKEX announcement of 4 February 2015 at https://www.hkex.com.hk/News/Market-Communications/2015/150204news?sc_lang=en
    reports 26 of 124 listed ETFs still subject to stamp duty and confirms the universal waiver starts on 13 February 2015.
  status: open

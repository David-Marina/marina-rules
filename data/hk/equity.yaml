# Hong Kong securities market (SEHK, MIC XHKG): ordinary shares (hk_stock) and exchange-traded funds (hk_etf;
# hk_etf_part_b for the spread table of ETFs traded on Part B).
# Rules: stamp duty, SFC and AFRC transaction levies, Investor Compensation Fund levy (suspended: 0), exchange trading
# fee and trading tariff, CCASS stock settlement fee, daily price limit (none), ordinary full-day trading sessions,
# same-day resale and settlement cycle; HKD spread tables (tick_size_table: shares Part A; ETFs Part A, then Part D from
# 2020-06-01, or Part B), pre-opening and closing-auction outer price limits (opening_auction_limit_pct,
# closing_auction_limit_pct), tiered Volatility Control Mechanism triggers (vcm_trigger_pct), the continuous-trading
# quotation spread limit (order_spread_limit: 24 spreads, or a wider percentage from 2023-03-20 for ETFs and 2025-08-04
# for shares), the order-price multiple check (order_price_multiple_limit: nine times, five times from 2026-11-02) and
# the short-selling tick rule (short_sale_price_test). Index membership, CAS / VCM eligibility, designated securities
# for short selling and an ETF's spread table are the caller's to determine; the values describe eligible securities
# only.
# Coverage starts 2010-01-01. Sources: IRD / GovHK, HKEX and HKSCC circulars, rules, fee pages, FAQs and
# trading-mechanism papers, archived SFC guidance; half-day trading, severe-weather trading and market-maker or
# crossed-trade concessions appear only in notes.
schema: 1.1
market: XHKG
asset_class: equity
records:
- id: hk.stamp_duty_buy.hk_stock.2001-09-01
  scope: hk_stock
  rule: stamp_duty_buy
  value: 0.001
  effective_from: '2001-09-01'
  effective_to: '2021-08-01'
  published_at: null
  recorded_at: '2026-11-04'
  verification: single-source
  sources:
  - url: https://www.ird.gov.hk/eng/pdf/sd_stock_rates.pdf
    publisher: Inland Revenue Department
    title: Historical stamp duty rates on Hong Kong stock
    date: null
    kind: official
    quote: 'From 1 September 2001 to 31 July 2021: Stamp duty on sale or purchase of any Hong Kong stock is charged at rate
      which vary with the amount or value of the consideration as follows:- Nature of Document Rate Contract Note for sale
      or purchase of any Hong Kong stock 0.1% of the amount of the consideration or of its value on every sold note and every
      bought note'
    content_sha256: 0262489a033010c72e7d78f4b5951d5416cce37989a631b081e71f755c584210
    hash_kind: bytes
  - url: https://www.ird.gov.hk/eng/pdf/sd_stock_rates.pdf
    publisher: Inland Revenue Department
    title: Historical stamp duty rounding
    date: null
    kind: official
    quote: With effect from 1 July 1998, where the stamp duty calculated includes a fraction of $1, round-up the duty to the
      nearest $1.
    content_sha256: 0262489a033010c72e7d78f4b5951d5416cce37989a631b081e71f755c584210
    hash_kind: bytes
  notes: Ad valorem stamp duty on each bought and sold contract note; consideration or value as prescribed. Round the computed
    duty up to the nearest HKD 1; do not round turnover up to HKD 1,000 for this period.

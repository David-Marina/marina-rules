  value: 2
  effective_from: '2010-01-01'
  effective_to: null
  published_at: null
  recorded_at: '2026-11-04'
  verification: single-source
  sources:
  - url: https://www.hkex.com.hk/Global/Exchange/FAQ/Securities-Market/Trading/Securities-Market-Operations?sc_lang=en
    publisher: HKEX
    title: 'Securities Market Operations FAQ: T+2'
    date: null
    kind: official
    quote: Exchange Participants (i.e. brokers) are required to prepare sufficient shares for settling in the Central Clearing
      and Settlement System (CCASS) before 3:45 p.m. on the second Settlement Day following T-day (the transaction day), or
      T+2, for all transactions concluded or reported through the Exchange’s trading system on T-day. The related money settlement
      will also be completed on the same day. However, investors should note that the T+2 arrangement is only a settlement
      arrangement between Exchange Participants and the clearing house. All the settlement arrangements, including securities
      and money settlement, between Exchange Participants and their clients are commercial agreements between them.
    content_sha256: 6e900c9bc6881289153543046801a3f47c638ee43134c2524463c801889e4117
    hash_kind: text
  notes: T+2 means the second settlement day after the trade, applying to Exchange Participant/clearing-house settlement.
    Client payment and delivery terms may differ. Original commencement was not located; start is clipped to 2010-01-01 and
    historical continuity is an inference, not a verified date. Non-settlement days do not count.

  notes: ETF short selling is exempt from the price tick test for all participants, not merely ETF market makers;
    restriction=exempt does not mean unrestricted or naked short selling. Ordinary short sales still require designated-security
    eligibility and covering arrangements, and the caller must check HKEX's effective designation/exemption list;
    Marina stores no security list. The Commission-approved Market Making Security exception in Eleventh Schedule
    (15) supplies the legal mechanism. The dated 2002 statement establishes the all-ETF exemption, and the current
    auction guidance corroborates its continuation. Historical continuity is a single-publisher inference. From
    1 November 2024 registered ETF securities market makers may additionally enter their market-making orders during
    POS and CAS under Rule 563D(2) and Schedule 14; the general all-participant ETF tick exemption is unchanged.
    Auction order-type and outer price-band requirements still apply. Independent SFC guidance is retained as an
    Internet Archive copy, so this record remains single-source; its legacy footnote lists example ETF exemptions
    rather than proving the all-ETF commencement date.

  effective_to: '2020-01-01'
  published_at: '2005-11-11'
  recorded_at: '2026-11-05'
  verification: single-source
  sources:
  - &id013
    url: https://www.hkex.com.hk/Services/Rules-and-Forms-and-Fees/Fees/Securities-(Hong-Kong)/Trading/Transaction?sc_lang=en
    publisher: HKEX
    title: 'Securities trading fees: Investor Compensation Levy'
    date: null
    kind: official
    quote: Effective 19 December 2005, the payment of Investor Compensation Levy (i.e. 0.002% per side of the consideration
      of a transaction, rounded to the nearest cent) has been suspended by the SFC.
    content_sha256: 6739ffa1b7216d7d2332a6edf5581c1792e3ac60d98bdd03394f5d8e6d7d6a08
    hash_kind: text
  - &id016
    url: https://www.hkex.com.hk/Services/Rules-and-Forms-and-Fees/Fees/Securities-(Hong-Kong)/Trading/Transaction?sc_lang=en
    publisher: HKEX
    title: Exemption applies to sales and purchases of securities
    date: null
    kind: official
    quote: investors are not required to pay Investor Compensation Levies in respect of sales and purchases of securities
      and futures contracts with effect from 19 December 2005 until terminated by a termination notice published
      by the SFC.
    content_sha256: 6739ffa1b7216d7d2332a6edf5581c1792e3ac60d98bdd03394f5d8e6d7d6a08
    hash_kind: text
  - &id015
    url: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2019/CT13419E.pdf
    publisher: HKEX
    title: 'CT/134/19: Updates to Investor Compensation Levy'
    date: '2019-12-27'
    kind: official
    quote: The collection of ICL is currently suspended and no person is required to pay the ICL according to a
      Securities and Futures Commission (SFC) exemption notice published on 11 November 2005, which continues to
      have effect until a notice to terminat e the exemption notice is published by the SFC. If the SFC is to publish
      a termination of exemption notice, t he effective date of the reinstatement of the ICL, if any, shall not
      be earlier than 2 months after the date of such publication.
    content_sha256: 87d0c8ef2bd09c3b516269213449b6f50f4ace6c6bc321d8eb0262931e3b9a55
    hash_kind: bytes
  - &id014
    url: https://www.info.gov.hk/gia/general/201910/11/P2019101100233.htm
    publisher: Hong Kong Government
    title: Enhancements to investor compensation regime gazetted
    date: '2019-10-11'
    kind: official
    quote: (b) consequential to the increase in the compensation limit, raising the trigger levels for suspending
      and reinstating the ICF levy, i.e. raising the suspension level from $1.4 billion to $3 billion, and the reinstatement
      level from $1 billion to $2 billion. The above trigger levels will not affect the levy suspension in effect
      since 2005;
    content_sha256: daae4a7c8dbb3e57d8de411b849e3abfa85214af0e03987a5fe9c1cd8b52e020
    hash_kind: text
  notes: Suspended levy on each purchase and sale of securities, including secondary-market ETF units. The unsuspended
    rate is 0.002% of consideration per side (0.00002), rounded to the nearest cent. Zero is the sourced suspension,
    not an assumption. Suspension continues until the SFC publishes a termination notice; reinstatement cannot take
    effect earlier than two months after that publication. No reinstatement was located before 2026-11-04. The former
    net-asset trigger levels were HKD 1.4 billion for suspension and HKD 1 billion for reinstatement. The suspension
    effective date is stated by HKEX; its 2019 circular dates the original SFC exemption notice to 11 November 2005.
    The original notice itself was not obtained; published_at is the 11 November 2005 publication date expressly
    reported by HKEX in CT/134/19 (official retrospective notice basis).

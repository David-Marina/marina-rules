    title: VCM information paper, sections 5-6
    date: null
    kind: official
    quote: The VCM is only applicable to board lot order input during certain periods of the CTS (more details below) , but
      not for any order input during the Pre-opening Session (POS) and the Closing Auction Session (CAS). … Periods during
      the CTS when VCM Monitoring will not be applied • Market Open - The VCM monitoring is not applied at the first 15 minutes
      of the Morning and Afternoon CTS to allow free price discovery at the beginning of the CTS after a trading break. •
      Afternoon CTS (or morning CTS on half-day trading day) - The VCM monitoring is not applied at the last 20 minutes8 of
      the afternoon CTS (or morning CTS on half-day trading day) in order to ensure that there is an uninterrupted trading
      period (not interfered by an cooling-off period) during the last 15 minutes of the last CTS of the day. This can also
      allow investors to unwind their day positions and avoid taking overnight risks.

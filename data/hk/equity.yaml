    url: https://www.hkex.com.hk/Global/Exchange/FAQ/Securities-Market/Trading?sc_lang=en
    publisher: HKEX
    title: 'Trading FAQ: upper and reciprocal lower boundaries, and CAS application'
    date: null
    kind: official
    quote: 'In all circumstances, an order shall not be made at a price that deviates 5 times or more from the nominal
      price or is one-fifth or less of that price. For Structured Product, the order price must not deviate 9 times
      or more from the nominal price or is one-ninth or less of that price:  … In CAS, orders would be subject to
      the ± 5% price limit and 5-times rule checking but the quotation rules is not applicable for CAS. '
    content_sha256: d24a56fae407b290baaff3d7518c01ce9e1d762ecfafca6dd93dc9971f4f38dc
    hash_kind: text
  notes: Order-entry multiplicative check, separate from the CTS quotation and auction percentage limits. For available
    positive reference R and multiple N, reject price >= N*R or price <= R/N; equality at either threshold is rejected.
    Rule 505A uses nominal price; Rule 503 uses previous close for the first bid if no first ask of the day, or
    first ask if no first bid, whether the opening quotation occurs in POS or CTS. Reference enum nominal_or_previous_close_for_opening
    represents these two legal cases, not a caller option. No check can be computed when the prescribed reference
    is unavailable; Rule 504 permits waiver of Rule 503. Under Rule 101, POS nominal price is IEP if available,
    otherwise previous close. CTS nominal price starts from last trade, or previous close if untraded that day;
    replace it with current bid if that bid is higher, otherwise with current ask if that ask is lower. For CAS
    securities, CAS nominal price is IEP if available, otherwise CAS reference price; CAS applies only when that
    session is offered (the modern CAS began 25 July 2016 and later expanded), not throughout the pre-2016 window.
    The check applies in CTS and to priced at-auction limit orders in POS and CAS; an at-auction order without a
    specified price is not assigned an input-price ratio. Unmatched POS at-auction limit orders are carried into
    CTS only if the price also passes the multiple check at the end of matching; other unmatched auction orders
    are deleted. Stocks and ETFs share this multiplicative rule; ETF tick-table choice does not change N. No broker-specific
    parameter or new context key is assumed.  Here N=9. The 2008 existing-controls description and later nine-times
    restatements establish a pre-existing regime; its original commencement was not found, so the start is truncated
    to 2010-01-01 and continuity is inferred. The current FAQ's nine-times reciprocal explanation for structured
    products confirms the boundary convention, not an exception for stocks or ETFs; its five-times text is not backdated.
    The modern CAS reference definition is used only for dates on which that session exists.

  notes: 'CTS passive-price boundary for ordinary limit orders under Rules 503, 506A and 507A; the same passive
    boundary also applies to enhanced limit orders. It is not a symmetric band around nominal price and is not the
    aggressive-side matching limit. With both queues present, a limit buy must be no lower than (current best bid
    minus 24 spread steps) and no higher than current best ask; a limit sell must be no higher than (current best
    ask plus 24 spread steps) and no lower than current best bid. For a non-opening buy, use current bid when the
    buy queue exists; otherwise use the lowest of current ask, previous close and day low if the sell queue exists,
    or the lowest of last ask, previous close and day low if both queues are empty. For a non-opening sell, use
    current ask when the sell queue exists; otherwise use the highest of current bid, previous close and day high
    if the buy queue exists, or the highest of last bid, previous close and day high if both queues are empty. When
    both queues are empty and neither previous close nor the relevant day low/high is available, the respective
    Rule 506A(4)/507A(4) spread restriction does not bind. The first quotation of the day in CTS uses previous close:
    a first buy with no first ask has a lower boundary, and a first sell with no first bid has an upper boundary;
    Rule 504 permits Exchange waiver, including ex-dividend cases. Rules 506A/507A do not apply to POS or CAS auction
    orders (Rule 505); consult the separate auction rules. Enhanced limit orders have a separate aggressive boundary
    governed by the rules in force on the date, and special limit orders have different rules; those boundaries
    are not the 24-spread field. Count price steps using the security''s applicable tick_size_table and date. Rule
    101 defines a spread by the Second Schedule; no explicit cross-band counting algorithm was located, so multiplying
    all 24 steps by the starting tick is not established by the cited text. The true 24-spread start is 4 July 2005
    (eight to twenty-four); continuity between official restatements is inferred, hence single-source.  From 2025-08-04
    the boundary is the wider of max_spreads (24 spreads) and wider_pct (5%) of the reference price; max_spreads
    alone is not an absolute cap of 24 price steps and cannot by itself reject an order. For a buy use min(reference
    minus 24 steps, reference times (1 minus 5%) rounded UP to a valid spread); for a sell use max(reference plus
    24 steps, reference times (1 plus 5%) rounded DOWN to a valid spread). This substitutes for the passive boundary
    in each opening and missing-queue case above. There is no security-by-security phase-in. The 2 November 2026
    pre-trade reform changes the separate multiplicative check (order_price_multiple_limit), not max_spreads or
    wider_pct. Ordinary shares use the applicable Part A spread table; subsequent changes to tick sizes do not change
    the count of 24.'

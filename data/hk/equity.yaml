    title: 'CT/141/22: Trading fee structure enhancement'
    date: '2022-11-01'
    kind: official
    quote: Existing Trading Fee Structure New Trading Fee Structure 1. Trading Tariff of HK$0.50 payable on each and every
      purchase and sale transaction; and Trading Tariff removed 2. Trading Fee of 0.005% per side of the consideration of
      a transaction (rounded to the nearest cent) Trading Fee of 0.00565% per side of the consideration of a transaction (rounded

  - url: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2021/ce_SEHK_CT_080_2021.pdf
    publisher: HKEX
    title: 'CT/080/21: stamp duty increase'
    date: '2021-06-03'
    kind: official
    quote: Exchange Participants (EPs) are requested to note that the Government published in The Gazette the “Revenue (Stamp
      Duty) Bill 2021“ (the “Bill”) on 5 March 2021, and on 2 June 2021 second and third readings have been passed by the
      Legislative Council, confirming that the Bill , will come into effect on 1 August 2021 . Under the Bill, along with
      other amendments, the rate of Stamp Duty payable on contract notes for the sale or purchase of Hong Kong stocks (not
      being jobbing business) will be increased from 0.1% to 0.13%, as a percentage of transaction value (“stamp duty increase”).
    content_sha256: cb3986493b92483236c474fbbce0b06a6e27fe85e00d4faf3973609bffe14b31
    hash_kind: bytes
  notes: Ad valorem stamp duty on each bought and sold contract note; consideration or value as prescribed. Round the computed
    duty up to the nearest HKD 1; do not round turnover up to HKD 1,000 for this period.

    title: 'LSD/69/2016: original VCM monitoring periods, limits and duration'
    date: '2016-08-08'
    kind: official
    quote: 'The amendments, as set out in the Appendix, will come into effect on Monday, 22 August 2016. … 513B (1) All orders
      for a VCM security input into the System during the Continuous Trading Session, with the exception of the following
      periods, shall be subject to VCM monitoring: (a) the first 15 minutes of the Morning Session; (b) the last 20 minutes
      of the Morning Session on the eves of Christmas, New Year and Lunar New Year; (c) the first 15 minutes and the last
      20 minutes of the Afternoon Session; and 3 (d) such other time or times as the Exchange may from time to time prescribe.
      (2) For the purposes of Rules 513B(3), 513C(2) and 513C(3), unless otherwise determined by the Exchange – (a) the upper
      price limit means a price which is 10% (or such other percentage as the Exchange may from time to time determine) higher
      than the VCM reference price, rounded down to the nearest spread; and (b) the lower price limit means a price which
      is 10% (or such other percentage as the Exchange may from time to time determine) lower than the VCM reference price,
      rounded up to the nearest spread. … 513C (1) A cooling-off period triggered during the Morning Session or the Afternoon
      Session pursuant to Rule 513B(3) shall last for 5 minutes (or such other duration as may be determined by the Exchange
      from time to time) from its commencement or until the end of the Morning Session or the Afternoon Session (as the case
      may be), whichever ends earlier.'
    content_sha256: 4303be39cfbfd340bbadab65a30878629bb8bf699d605b67bfe28c072282887b
    hash_kind: bytes
  notes: The trigger tests whether a potential board-lot automatch trade deviates by more than the tier fraction from the
    last automatch traded price five minutes earlier; it is not a daily price limit. A five-minute cooling-off period permits
    trading only inside the fixed band of the same fraction around that reference price. No VCM applies in POS or CAS, in
    the first 15 minutes of the morning or afternoon continuous session, or in the last 20 minutes of the final continuous
    session (leaving the last 15 minutes free of cooling-off). Morning cooling-off time is not carried into the afternoon.
    Marina does not store index constituents or eligibility histories; the caller must determine membership on the trade date.
    Securities outside the listed classes are not subject to this rule. At most one trigger per stock in each morning/afternoon
    session; monitoring stops after that cooling-off period. Original Rule 513B confirms the first-15-minute and last-20-minute
    monitoring exclusions. The upper bound is rounded down and the lower bound up to the nearest spread.

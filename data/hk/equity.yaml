    Rule 505A uses nominal price; Rule 503 uses previous close for the first bid if no first ask of the day, or
    first ask if no first bid, whether the opening quotation occurs in POS or CTS. Reference enum nominal_or_previous_close_for_opening
    represents these two legal cases, not a caller option. No check can be computed when the prescribed reference
    is unavailable; Rule 504 permits waiver of Rule 503. Under Rule 101, POS nominal price is IEP if available,
    otherwise previous close. CTS nominal price starts from last trade, or previous close if untraded that day;
    replace it with current bid if that bid is higher, otherwise with current ask if that ask is lower. For CAS
    securities, CAS nominal price is IEP if available, otherwise CAS reference price; CAS applies only when that
    session is offered (the modern CAS began 25 July 2016 and later expanded), not throughout the pre-2016 window.
    The check applies in CTS and to priced at-auction limit orders in POS and CAS; an at-auction order without a
    specified price is not assigned an input-price ratio. Unmatched POS at-auction limit orders are carried into
    CTS only if the price also passes the multiple check at the end of matching; other unmatched auction orders
    are deleted. Stocks and ETFs share this multiplicative rule; ETF tick-table choice does not change N. No broker-specific
    parameter or new context key is assumed.  Here N=5, effective 2 November 2026. CT/159/26 on 2 October announces
    the launch, subject to the post-release test; the subsequent final amendment and effective-date register confirm
    the effective date. published_at uses the final rule amendment circular dated 26 October 2026. Structured products
    retain nine times but are outside both scopes. Phase 1 amends Rules 501I, 503 and 505A; the extracted marked-up
    digits must not be read as fifty-nine. All sources belong to HKEX, so independent-publisher verification is
    not met.

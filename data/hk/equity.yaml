    date: null
    kind: official
    quote: '“nominal price” (a) in respect of any issue of securities at any one time during or at the close of
      the Pre -opening Session means:- (i) (when the IEP can be determined in accordance with Rule 501H) the IEP;
      otherwise (ii) the previous closing price; (b) in respect of an issue of securities at any one time during
      or at the close of the Continuous Trading Session on a trading day means:- (i) if the issue has been traded
      up to that time on the day (A) (when the current bid price is greater than the last recorded price), the current
      bid price; otherwise (B) (when the current ask price is less than the last recorded price), the current ask
      price; otherwise (C) where both (b)(i)(A) and (b)(i)(B) 1-21 above do not apply, then the last recorded price;
      or (ii) if the issue has not been traded up to that time on the day:- (A) (when the current bid price is greater
      than the previous closing price), the current bid price; otherwise (B) (when the current ask price is less
      than the previous closing price), the current ask price; otherwise (C) where both (b)(ii)(A) and (b)(ii)(B)
      above do not apply, then the previous closing price; (c) in respect of an issue of securities at any one time
      during or at the close of the Closing Auction Session means:- (i) (when it is an issue of CAS securities and
      the IEP can be determined in accordance with Rule 501M) the IEP; otherwise (ii) the CAS reference price; '

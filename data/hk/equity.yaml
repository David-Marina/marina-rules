  sources:
  - url: https://www.gov.hk/en/residents/taxes/stamp/stamp_duty_rates.htm
    publisher: GovHK / Inland Revenue Department
    title: 'Rates of stamp duty: transfer of Hong Kong stock'
    date: null
    kind: official
    quote: 'With effect from 17 November 2023, stamp duty on sale or purchase of any Hong Kong stock is charged at rate which
      vary with the amount or value of the consideration as follows: (Where the stamp duty calculated includes a fraction
      of $1, round-up the duty to the nearest $1.) Nature of Document Rate Contract Note for sale or purchase of any Hong
      Kong stock 0.1% of the amount of the consideration or of its value on every sold note and every bought note'
    content_sha256: 1c93480c405845655e42170b2f76d9ca87bb7e5f5255d10fb59ca9928f89cb26
    hash_kind: text
  - url: https://www.hkex.com.hk/-/media/HKEX-Market/Services/Circulars-and-Notices/Participant-and-Members-Circulars/SEHK/2023/ce_SEHK_CT_158_2023.pdf
    publisher: HKEX
    title: 'CT/158/23: stamp duty reduction effective 17 November 2023'
    date: '2023-11-15'
    kind: official
    quote: The Amendment Ordinance will be published in the Gazette on 16 November 2023 and come into operation on 17 November
      2023 . Under the Bill, the rate of stamp duty chargeable on a contract note for the sale or purchase of any Hong Kong
      stock (not being jobbing business) will be reduced from 0.13% to 0.1%. In view of this, EPs are advised to implement
      the reduced stamp duty rate from 17 November 2023.
    content_sha256: c3810abf83dd53b22f6f58a9301525a01b80bb922e52f88543e411b2f90689d3
    hash_kind: bytes
  - url: https://www.info.gov.hk/gia/general/202311/15/P2023111500359.htm
    publisher: Hong Kong Government (info.gov.hk)
    title: Government welcomes passage of Stamp Duty (Amendment) (Stock Transfers) Bill 2023
    date: '2023-11-15'
    kind: official
    quote: The Government welcomes the Legislative Council's passage of the Stamp Duty (Amendment) (Stock Transfers) Bill
      2023 today (November 15) to give effect to the measure of reducing the rate of Stamp Duty on Stock Transfers (the Stamp
      Duty) to 0.1 per cent as announced by the Chief Executive in the 2023 Policy Address. … The Amendment Ordinance will
      be published in the Gazette tomorrow (November 16) and come into operation on November 17.
    content_sha256: eecd8050019a94bba73e0e4719c2a47f487b824e441f8d7517f8561aedc9988a
    hash_kind: text
  notes: Each bought and sold note is taxed. Round computed duty up to the nearest HKD 1; consideration or value as prescribed.
- id: hk.stamp_duty_buy.hk_etf.2015-02-13
  scope: hk_etf
  rule: stamp_duty_buy
  value: 0
  effective_from: '2015-02-13'
  effective_to: null
  published_at: '2015-02-04'
  recorded_at: '2026-11-04'
  verification: verified
  sources:
  - url: https://www.ird.gov.hk/eng/pdf/sdo/ext_cir/so_ext_cir_02_2015_e.pdf
    publisher: Inland Revenue Department
    title: Stamping Circular No. 02/2015
    date: '2015-02-13'
    kind: official
    quote: This circular announces that the Stamp Duty (Amendment) Ordinance 2015 (“the Amendment Ordinance”) was published
      in the Gazette on 13 February 2015 (“Relevant Date”). The Amendment Ordinance amends the Stamp Duty Ordinance (Cap.
      117) (“SDO”) to waive stamp duty payable on the transfers of shares or units of all exchange traded funds (“ETFs”).
      The ETF stamp duty waiver took effect on the Relevant Date.
    content_sha256: 5ec7797a0ea3b787564a5aa9411d069baa2e7afcbbc10dd27ec40f488b2750a5
    hash_kind: bytes
  - url: https://www.hkex.com.hk/News/Market-Communications/2015/150204news?sc_lang=en
    publisher: HKEX
    title: Stamp duty waiver for all ETFs to take effect on 13 February 2015
    date: '2015-02-04'
    kind: official
    quote: Hong Kong Exchanges and Clearing Limited (HKEx) announced today (Wednesday) that a stamp duty waiver for all Exchange
      Traded Funds (ETFs) listed in Hong Kong will take effect on 13 February 2015 following the passage of the Stamp Duty
      (Amendment) Bill 2014 today in the Legislative Council.
    content_sha256: d3d90cbd9e408f51dde40ed8d7894e4413c0ac483b3cea7e709b6821c00336c7
    hash_kind: text
  notes: Statutory waiver for transfers of shares or units of all ETFs under Cap. 117; applies to sale and purchase contract
    notes. Earlier ETF treatment was conditional and is left as a gap.

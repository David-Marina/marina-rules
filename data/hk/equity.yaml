    Naked or uncovered short selling is prohibited for ordinary investors; prescribed statutory market-making/hedging
    exemptions are not a blanket investor permission. Rule 563D and Eleventh Schedule (15), not Rule 563K, are the
    relevant provisions. Eligible securities market-maker transactions, structured-product liquidity-provider transactions,
    designated index arbitrage, stock-futures hedging, structured-product hedging and options hedging have prescribed
    exemptions (Schedules 14, 15 and 18). Structured products themselves are outside these scopes, but hedging their
    underlying shares may qualify. Regular short-sale order entry is in continuous trading; new regular short-sale
    orders were not accepted in POS or the initial CAS. The June 2010 adoption of the term Market Making Security
    did not change the ask-price comparison for ordinary shares. The original start of the enduring stock tick-rule
    regime was not established, so this record is truncated at the coverage floor; historical continuity is an inference.
    Independent SFC guidance is retained as an Internet Archive copy, so this record remains single-source; its
    legacy footnote lists example ETF exemptions rather than proving the all-ETF commencement date.'

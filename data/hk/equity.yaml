  verification: single-source
  sources:
  - &id001
    url: https://www.hkex.com.hk/Global/Exchange/FAQ/Products/Securities/ETP?sc_lang=en
    publisher: HKEX
    title: 'Frequently asked questions: exchange traded products (trading bands)'
    date: null
    kind: official
    quote: A-shares are subject to trading bands which restrict increases and decreases in the trading price, while securities
      listed on the Exchange are not.
    content_sha256: cd0482c1ed1de9bbfdbddcd7a05940db79acd4353f9551515b693d6f9a6b2b9d
    hash_kind: text
  - &id002
    url: https://www.hkex.com.hk/News/Market-Communications/2016/160818news?sc_lang=zh-HK
    publisher: HKEX
    title: 香港交易所將於旗下證券市場推出市場波動調節機制
    date: '2016-08-18'
    kind: official
    quote: 市調機制的作用並非限制 由 基本因素 引發 的股價波動，市場人士不應將其 視 為停牌機制， 也不應將其 與某些市場 採用的每日漲跌幅 限制混淆。
    content_sha256: 21e7076b1139f6a86c1bc9eb53c72a7d46ed809ff2af46c13a13c65f13a32fe0
    hash_kind: text
  notes: 'HKEX states that securities listed on the Exchange are not subject to trading bands, so no daily price limit applies.
    The Volatility Control Mechanism (from 2016-08-22; an intraday cooling-off period on individual stocks) and the closing
    auction session''s +/-5% band around the reference price are intraday mechanisms and are not encoded as a daily limit.
    The start is truncated at the coverage floor 2010-01-01: no daily limit regime is known before it, but no text dated before
    2010 was cited.'

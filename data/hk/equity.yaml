      (“HSMI”) and SmallCap (“HSSI”) Indexes, H shares which have corresponding A shares listed on a Mainland exchange, and
      all Exchange Traded Funds (“ETFs”). Given that the CAS auction mechanism has already been proven and well -accepted
      by the market, starting from 8 October 2019, CAS Securities were further expanded to cover all equities (including depository
      receipts, investment companies, preference shares and staple securities) and funds (including ETFs and REITs). Upon
      the rollout of the Pre -opening Session enhancement on 19 October 2020, Leveraged and Inverse Products w ere also added
      in CAS to ensure consistency of stock coverage in both opening and closing auctions. Structured products (i.e. Derivative
      Warrants (“DWs”), Callable Bull/Bear Contracts (“CBBCs”) and Inline Warrants), equity warrants, rights and debt securities
      continue to be excluded from CAS.

  notes: Symmetric outer limit for at-auction limit order entry during POS, not a daily price limit. Stage 1 (09:00-09:15
    Hong Kong time) is plus/minus 15% of the previous closing price (adjusted on ex-dates when available). Upper
    bound rounds down and lower bound rounds up to a valid spread under Rule 501G(1B). During 09:15-09:20 no-cancellation
    and random matching until at most 09:22, executable new orders must lie between the lower and higher of the
    highest bid and lowest ask recorded at 09:15; passive orders outside this inner range but inside the outer band
    may be entered and carried forward. Orders cannot then be amended or cancelled. If only one or neither side
    exists, the manual specifies fallback limits. No Stage 1 check in the absence of a previous closing price or
    on resumption from suspension under the applicable waiver; the exchange retains waiver discretion. Ordinary
    IPO shares have no first-stage limit on their first trading day. An additional non-percentage nine-times quotation
    check remained applicable. The 2026 manual restates the unchanged 15% mechanism but its five-times check must
    not be backdated.

  - *id010
  notes: 'The trigger tests whether a potential board-lot automatch trade deviates by more than the tier fraction from the
    last automatch traded price five minutes earlier; it is not a daily price limit. A five-minute cooling-off period permits
    trading only inside the fixed band of the same fraction around that reference price. No VCM applies in POS or CAS, in
    the first 15 minutes of the morning or afternoon continuous session, or in the last 20 minutes of the final continuous
    session (leaving the last 15 minutes free of cooling-off). Morning cooling-off time is not carried into the afternoon.
    Marina does not store index constituents or eligibility histories; the caller must determine membership on the trade date.
    Securities outside the listed classes are not subject to this rule. Only ETFs included in the quarterly VCM list qualify:
    at least three months listed and three-month average daily turnover at least HKD 100 million equivalent. Removal follows
    two consecutive quarters above HKD 50 million but below HKD 100 million, or a quarter below HKD 50 million, as stated
    in ETP/001/22. Multi-currency counters are assessed separately except parallel trading. The caller must use the effective
    HKEX eligibility list, not merely reapply the entry threshold daily. Multiple triggers per session apply. No ETF record
    or pre-commencement gap is created before 3 May 2022. The 2 November 2026 revision leaves ordinary ETF thresholds and
    eligibility unchanged.'

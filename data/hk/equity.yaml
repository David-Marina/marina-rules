    on resumption from suspension under the applicable waiver; the exchange retains waiver discretion. Ordinary
    IPO shares have no first-stage limit on their first trading day. From 2 November 2026 the additional quotation
    check tightened from nine times to five times; the 15% outer percentage did not change. This is phase 1 of pre-trade
    controls enhancement, not a second rollout of POS to a subset of stocks.
